---
# defaults file for shell_environment
shell_packages:
  - ncdu
  - bind-utils
  - curl
  - zsh
  - neovim
  - yadm
  - aria2
  - gpg
  - youtube-dl
  - ripgrep
  - topgrade
  - ansible
  - npm-default
  - pdfgrep
  - fzf

# Login shell of the target user (zsh is installed above)
shell_environment_user: "{{ target_user | default('Adrixan') }}"
shell_environment_login_shell: /usr/bin/zsh
