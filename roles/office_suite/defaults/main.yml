---
# defaults file for office_suite
office_packages:
  - libreoffice
  - libreoffice-base
  - libreoffice-calc
  - libreoffice-draw
  - libreoffice-impress
  - libreoffice-math
  - libreoffice-writer
  - okular
  - filezilla
  - chromium   # headless renderer for Marp PDF/PPTX export

# Marp CLI (Markdown slide decks to PDF, PPTX, HTML) in its own prefix, always on the latest release:
# every run updates the whole tree. Its latest release still ranges onto affected puppeteer-core 24
# (extract-zip, proxy-agent chain), katex, @xmldom/xmldom, basic-ftp and zod, so these are forced to
# their latest release (HTML and PDF export verified); npm audit gates the role.
office_marp_dir: /opt/marp-cli
office_marp_overrides:
  puppeteer-core: latest
  katex: latest
  "@xmldom/xmldom": latest
  basic-ftp: latest
  zod: latest

# pandoc from its latest upstream release (Tumbleweed lags behind), verified against the release digest
office_pandoc_repo: jgm/pandoc
