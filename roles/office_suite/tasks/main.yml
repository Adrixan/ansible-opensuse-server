---
# tasks file for office_suite
- name: Install office suite applications
  community.general.zypper:
    name: "{{ office_packages }}"
    state: present

- name: Create the Marp CLI prefix
  ansible.builtin.file:
    path: "{{ office_marp_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write the Marp CLI manifest (latest release)
  ansible.builtin.copy:
    dest: "{{ office_marp_dir }}/package.json"
    content: "{{ {'name': 'marp-cli', 'private': true, 'dependencies': {'@marp-team/marp-cli': 'latest'}, 'overrides': office_marp_overrides} | to_nice_json }}"
    owner: root
    group: root
    mode: '0644'
  register: office_marp_manifest

# `npm update` resolves `latest` past the lockfile and lifts the whole tree; a fresh prefix installs first
- name: Install or update Marp CLI (no browser download, no install scripts)
  ansible.builtin.command:
    argv:
      - npm
      - "{{ 'update' if (office_marp_dir + '/node_modules') is exists else 'install' }}"
      - --omit=dev
      - --ignore-scripts
      - --no-fund
      - --no-audit
    chdir: "{{ office_marp_dir }}"
  environment:
    PUPPETEER_SKIP_DOWNLOAD: "1"
  register: office_marp_update
  when: not ansible_check_mode
  changed_when: "'up to date' not in office_marp_update.stdout"

- name: Audit the Marp CLI dependency tree (fails on any known vulnerability)
  ansible.builtin.command:
    argv: [npm, audit, --omit=dev, --audit-level=low]
    chdir: "{{ office_marp_dir }}"
  changed_when: false
  check_mode: false

- name: Install the marp wrapper (uses the system Chromium)
  ansible.builtin.copy:
    dest: /usr/local/bin/marp
    content: |
      #!/bin/sh
      # Managed by Ansible (office_suite): Marp CLI from {{ office_marp_dir }} with the system Chromium
      : "${CHROME_PATH:=/usr/bin/chromium}"
      export CHROME_PATH
      exec {{ office_marp_dir }}/node_modules/.bin/marp "$@"
    owner: root
    group: root
    mode: '0755'

- name: Set the pandoc release architecture
  ansible.builtin.set_fact:
    office_pandoc_arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Resolve the latest pandoc release
  ansible.builtin.include_role:
    name: github_release
  vars:
    github_release_repo: "{{ office_pandoc_repo }}"
    github_release_asset: "^pandoc-[0-9.]+-linux-{{ office_pandoc_arch }}\\.tar\\.gz$"

- name: Set the pandoc version
  ansible.builtin.set_fact:
    office_pandoc_version: "{{ github_release.version }}"

- name: Download pandoc {{ office_pandoc_version }} (release digest verified)
  ansible.builtin.get_url:
    url: "{{ github_release.asset_url }}"
    dest: "/var/cache/{{ github_release.asset_name }}"
    checksum: "sha256:{{ github_release.sha256 }}"
    mode: '0644'

- name: Unpack pandoc into /opt
  ansible.builtin.unarchive:
    src: "/var/cache/{{ github_release.asset_name }}"
    dest: /opt
    remote_src: true
    creates: "/opt/pandoc-{{ office_pandoc_version }}/bin/pandoc"
    owner: root
    group: root

- name: Link pandoc into /usr/local/bin (shadows the older distribution package)
  ansible.builtin.file:
    src: "/opt/pandoc-{{ office_pandoc_version }}/bin/pandoc"
    dest: /usr/local/bin/pandoc
    state: link
    force: true
