---
# Resolve the latest stable GitHub release of github_release_repo (owner/name). With
# github_release_asset (a regex on the asset name) the matching asset's URL and its sha256 digest
# from the release metadata are returned too, so downloads stay checksum-verified without pins.
# Result: fact github_release = {tag, version, asset_name, asset_url, sha256}.

- name: Look up the latest release of {{ github_release_repo }}
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ github_release_repo }}/releases/latest"
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    return_content: true
  register: github_release_response
  check_mode: false

- name: Select the release asset of {{ github_release_repo }}
  ansible.builtin.set_fact:
    github_release_assets: >-
      {{ github_release_response.json.assets | default([])
         | selectattr('name', 'search', github_release_asset) | list
         if github_release_asset | length > 0 else [] }}

- name: Fail on a missing asset or digest for {{ github_release_repo }}
  ansible.builtin.assert:
    that:
      - not github_release_response.json.prerelease | bool
      - github_release_asset | length == 0 or github_release_assets | length == 1
      - >-
        github_release_asset | length == 0
        or (github_release_assets[0].digest | default('') | regex_search('^sha256:[0-9a-f]{64}$')) is not none
    fail_msg: >-
      {{ github_release_repo }} {{ github_release_response.json.tag_name }}: expected exactly one asset
      matching '{{ github_release_asset }}' with a sha256 digest, found
      {{ github_release_assets | map(attribute='name') | list }}
    quiet: true

- name: Record the release of {{ github_release_repo }}
  ansible.builtin.set_fact:
    github_release:
      tag: "{{ github_release_response.json.tag_name }}"
      version: "{{ github_release_response.json.tag_name | regex_replace('^v', '') }}"
      asset_name: "{{ github_release_assets[0].name if github_release_assets else '' }}"
      asset_url: "{{ github_release_assets[0].browser_download_url if github_release_assets else '' }}"
      sha256: "{{ github_release_assets[0].digest | regex_replace('^sha256:', '') if github_release_assets else '' }}"
