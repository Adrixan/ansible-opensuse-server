---
# tasks file for workstation_packages
- name: Remove dropped apps (refused when zypper would take anything else with them)
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', '-I', workstation_packages_helper, 'remove', '--allow', workstation_packages_remove_allow, '--names']
         + (workstation_packages_absent | difference(workstation_packages_keep))
         + ([] if ansible_check_mode else ['--apply']) }}
  become: true
  check_mode: false
  register: workstation_packages_remove
  changed_when: (workstation_packages_remove.stdout | from_json).changed
  failed_when: workstation_packages_remove.rc != 0

- name: Lock dropped apps so no pattern, role run or sync installs them again
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', '-I', workstation_packages_helper, 'lock', '--comment', workstation_packages_lock_comment, '--names']
         + (workstation_packages_absent | difference(workstation_packages_keep))
         + ([] if ansible_check_mode else ['--apply']) }}
  become: true
  check_mode: false
  when: workstation_packages_lock | bool
  register: workstation_packages_locks
  changed_when: (workstation_packages_locks.stdout | from_json).changed
  failed_when: workstation_packages_locks.rc != 0

- name: Align packages and Flatpaks with {{ workstation_packages_align_source }}
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', '-I', workstation_packages_helper, 'align', '--state-dir', workstation_packages_align_state_dir,
          '--source', workstation_packages_align_source, '--exclude']
         + workstation_packages_align_exclude
         + ([] if ansible_check_mode else ['--apply']) }}
  become: true
  check_mode: false
  when: workstation_packages_align | bool
  register: workstation_packages_aligned
  changed_when: (workstation_packages_aligned.stdout | from_json).changed
  failed_when: workstation_packages_aligned.rc != 0

- name: Report alignment
  ansible.builtin.debug:
    msg: "{{ workstation_packages_aligned.stdout | from_json }}"
  when: workstation_packages_align | bool and (workstation_packages_aligned.stdout | from_json).changed

- name: Write the Termux package list for the phone
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', '-I', workstation_packages_helper, 'termux', '--state-dir', workstation_packages_align_state_dir,
          '--source', workstation_packages_align_source, '--map', workstation_packages_termux_map,
          '--out', workstation_packages_termux_list]
         + ([] if ansible_check_mode else ['--apply']) }}
  become: true
  become_user: "{{ workstation_packages_align_user }}"
  check_mode: false
  when: workstation_packages_termux_list | length > 0
  register: workstation_packages_termux
  changed_when: (workstation_packages_termux.stdout | from_json).changed
  failed_when: workstation_packages_termux.rc != 0
