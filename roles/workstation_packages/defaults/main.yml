  - qt5ct
  - skanlite
  - snobol4
  - splix
  - sqlitebrowser
  - steam
  - steamtricks
  - supermin
  - swtpm
  - unison
  - valkey
  - winetricks
  - x264
  - x265
  - xorg-x11-fonts-legacy
  - xscreensaver
  - xterm
  - yt-dlp-youtube-dl
