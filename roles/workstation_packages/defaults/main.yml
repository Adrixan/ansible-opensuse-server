# Per-host additions (hosts file): apps dropped on one host only, removed and locked there (round 3: m11x
# Discord, GameHub, File Roller, Filelight, transmission-gtk; xps13 transmission, CJK fonts, Cockpit remnants).
workstation_packages_absent_host: []

# Per-host exceptions (hosts file): names this host keeps although they are in the lists above.
workstation_packages_keep: []

# Packages that may leave together with the list (language packs, completions, plugins of the same app).
workstation_packages_remove_allow: '(-lang|-bash-completion|-zsh-completion|-fish-completion|-data|-plugin-.*|-mpris|-apparmor|-devel)$'

workstation_packages_lock: true
workstation_packages_lock_comment: "dropped by Peter 2026-11-18 (ansible workstation_packages)"

# Alignment (m11x): install what schulpc installed on purpose, read from the ws-sync state that Syncthing
# brings to every machine. Boot chain and hardware-specific packages never follow.
workstation_packages_align: false
workstation_packages_align_user: "{{ target_user | default('Adrixan') }}"
workstation_packages_align_state_dir: "/home/{{ workstation_packages_align_user }}/sync/ai/ws-sync"
workstation_packages_align_source: schulpc
workstation_packages_align_exclude:
  - "kernel-*"
  - "grub2*"
  - shim
  - mokutil
  - sdbootutil
  - systemd-boot
  - "patterns-*"
  - "*-firmware*"
  - "ucode-*"

workstation_packages_helper: "{{ role_path }}/files/pkg-policy.py"

# Termux list (schulpc only): CLI/TUI tools from files/termux-map.yml that are installed on the source host,
# written to the Syncthing folder the phone reads; termux-sync (yadm) installs them with `pkg`. Empty: off.
workstation_packages_termux_list: ""
workstation_packages_termux_map: "{{ role_path }}/files/termux-map.yml"
