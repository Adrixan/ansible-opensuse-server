---
# workstation_packages: keep apps Peter dropped off the workstations (removal plus zypper lock), and
# optionally align a host to schulpc's package set from the ws-sync state (m11x).

# Apps removed on Peter's decision (cleanup rounds 1 to 3, 2026-11-18). Only leaf applications belong here:
# a lock on a library would block `zypper dup` once a kept package starts to require it. Libraries,
# compilers and JDKs dropped the same day were removed once by hand and are not locked.
workstation_packages_absent:
  - accerciser
  - akonadi-import-wizard
  - akregator
  - discover6
  - discover6-backend-flatpak
  - discover6-backend-fwupd
  - discover6-backend-packagekit
