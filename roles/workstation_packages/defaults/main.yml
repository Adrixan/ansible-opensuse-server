  - gimp
  - gksu
  - gnome-tour
  - gnumeric
  - guayadeque
  - heimdall-frontend
  - hexchat
  - hplip
  - hstr
  - hub
  - joe
  - jupyter-jupyterlab
  - jupyter-notebook
  - kaddressbook
  - kakoune
  - kcharselect
  - kexec-tools
  - kleopatra
