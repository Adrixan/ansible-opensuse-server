less: less
lsof: lsof
make: make
mdbtools: mdbtools
ncdu: ncdu
neovim: neovim
openssh: openssh
p7zip-full: 7zip
/usr/local/bin/pandoc: pandoc
qpdf: qpdf
rclone: rclone
