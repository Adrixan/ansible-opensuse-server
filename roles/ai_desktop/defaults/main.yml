---
# Defaults for ai_desktop role

ai_desktop_user: "{{ target_user | default('Adrixan') }}"
ai_desktop_user_home: "{{ target_user_home | default('/home/' + ai_desktop_user) }}"

# Application feature flags
enable_claude_desktop: true
enable_antigravity_desktop: true

# Claude Desktop configuration (official Anthropic Debian repository)
claude_desktop_version: "2.7032.0"
claude_desktop_deb_url: "https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_{{ claude_desktop_version }}_amd64.deb"
claude_desktop_deb_checksum: "sha256:1e7f4504bca5b2f6b2d3c4123d145d727647e77f2ee2d046850711e61e7d7b11"
claude_desktop_install_dir: "/opt/claude-desktop"

# Google Antigravity Desktop configuration (official Google Cloud Storage repository)
antigravity_version: "2.17.0"
antigravity_build_id: "5217732355031040"
antigravity_tarball_url: "https://storage.googleapis.com/antigravity-public/antigravity-hub/{{ antigravity_version }}-{{ antigravity_build_id }}/linux-x64/Antigravity.tar.gz"
antigravity_tarball_checksum: "sha256:6a9b0ff60f7bd0d165022034aad9b047b3b0cf2ac56134feded8e68760e2ab01"
antigravity_install_dir: "/opt/antigravity"
