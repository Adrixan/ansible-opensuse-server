---
# Defaults for ai_desktop role

ai_desktop_user: "{{ target_user | default('Adrixan') }}"
ai_desktop_user_home: "{{ target_user_home | default('/home/' + ai_desktop_user) }}"
ai_desktop_user_uid: "{{ target_user_uid | default(1000) }}"

# Application feature flags
enable_claude_desktop: true
enable_claude_code: true

# Claude Desktop (official Anthropic signed apt repository, unpacked into /opt)
claude_desktop_repo_url: "https://downloads.claude.ai/claude-desktop/apt/stable"
# Pinned signer of the repository InRelease ("Anthropic Claude Code Release Signing")
claude_desktop_signing_key_fingerprint: "31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"
claude_desktop_signing_key: /usr/share/keyrings/claude-desktop.asc
# "latest" tracks the repository; set an exact version (e.g. "2.31226.1") to pin or roll back
claude_desktop_version: latest
claude_desktop_install_root: /opt
claude_desktop_install_dir: "{{ claude_desktop_install_root }}/claude-desktop"
claude_desktop_keep_versions: 2
claude_desktop_update_on_calendar: daily

# Claude Code CLI (official native installer, self-updating in ~/.local)
claude_code_install_url: "https://claude.ai/install.sh"
claude_code_bin: "{{ ai_desktop_user_home }}/.local/bin/claude"
claude_code_update_on_calendar: daily
# Remove the root-owned npm global copy, which never self-updates and goes stale
claude_code_remove_npm_global: true
