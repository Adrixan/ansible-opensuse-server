---
# Defaults for ai_desktop role

ai_desktop_user: "{{ target_user | default('Adrixan') }}"
ai_desktop_user_home: "{{ target_user_home | default('/home/' + ai_desktop_user) }}"
ai_desktop_user_uid: "{{ target_user_uid | default(1000) }}"

# Application feature flags
enable_claude_desktop: true
enable_claude_code: true
enable_antigravity_desktop: true
enable_antigravity_cli: true
enable_opencode_cli: true

# Claude Desktop (official Anthropic signed apt repository, unpacked into /opt)
claude_desktop_repo_url: "https://downloads.claude.ai/claude-desktop/apt/stable"
# Pinned signer of the repository InRelease ("Anthropic Claude Code Release Signing")
claude_desktop_signing_key_fingerprint: "31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"
claude_desktop_signing_key: /usr/share/keyrings/claude-desktop.asc
# "latest" tracks the repository; set an exact version (e.g. "2.31226.1") to pin or roll back
claude_desktop_version: latest
claude_desktop_install_root: /opt
claude_desktop_install_dir: "{{ claude_desktop_install_root }}/claude-desktop"
# Only the newest version stays installed; an older one that is still running is kept until it exits
claude_desktop_keep_versions: 1
claude_desktop_update_on_calendar: daily

# Claude Code CLI (official native installer, self-updating in ~/.local)
claude_code_install_url: "https://claude.ai/install.sh"
claude_code_bin: "{{ ai_desktop_user_home }}/.local/bin/claude"
claude_code_update_on_calendar: daily
# Remove the root-owned npm global copy, which never self-updates and goes stale
claude_code_remove_npm_global: true

# Superseded Claude Code CLI versions: the native installer and Claude Desktop both keep old copies
claude_prune_script: /usr/local/bin/claude-prune-versions
claude_code_keep_versions: 1
claude_code_versions_dir: "{{ ai_desktop_user_home }}/.local/share/claude/versions"
claude_code_desktop_bundled_dir: "{{ ai_desktop_user_home }}/.config/Claude/claude-code"

# Google Antigravity Desktop (official release feed and GCS bucket, unpacked into /opt)
antigravity_desktop_releases_url: "https://antigravity-hub-auto-updater-974169037036.us-central1.run.app/releases"
antigravity_desktop_bucket_url: "https://storage.googleapis.com/antigravity-public/antigravity-hub"
antigravity_desktop_metadata_url: "https://storage.googleapis.com/storage/v1/b/antigravity-public/o"
# "latest" tracks the release feed; set an exact version (e.g. "2.24.0") to pin or roll back
antigravity_desktop_version: latest
antigravity_desktop_install_root: /opt
antigravity_desktop_install_dir: "{{ antigravity_desktop_install_root }}/antigravity"
antigravity_desktop_keep_versions: 1
antigravity_desktop_update_on_calendar: daily

# Google Antigravity CLI (official native installer, self-updating in ~/.local/bin/agy)
antigravity_cli_install_url: "https://antigravity.google/cli/install.sh"
antigravity_cli_bin: "{{ ai_desktop_user_home }}/.local/bin/agy"
antigravity_cli_update_on_calendar: daily

# OpenCode CLI (official V2 native installer, self-updating in ~/.opencode/bin; the installer hardcodes that directory).
# The V1 installer (https://opencode.ai/install) refuses 2.x, so it would pin the CLI to the 1.x line.
opencode_cli_install_url: "https://opencode.ai/v2/install"
opencode_cli_major_version: 2
opencode_cli_bin: "{{ ai_desktop_user_home }}/.opencode/bin/opencode"
opencode_cli_update_on_calendar: daily
opencode_cli_remove_npm_global: true
opencode_restart_stale_server_script: /usr/local/bin/opencode-restart-stale-server
