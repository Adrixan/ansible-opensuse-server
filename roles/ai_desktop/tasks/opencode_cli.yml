---
# tasks for installing OpenCode CLI (native installer) and keeping it updated

- name: Install OpenCode CLI with the official native installer
  ansible.builtin.shell:
    # PATH entry for ~/.opencode/bin is managed in the shell config, not by the installer
    cmd: "set -o pipefail && curl -fsSL {{ opencode_cli_install_url | quote }} | bash -s -- --no-modify-path"
    executable: /bin/bash
    creates: "{{ opencode_cli_bin }}"
  become: true
  become_user: "{{ ai_desktop_user }}"

- name: Remove npm global OpenCode (root-owned, cannot self-update, shadowed the native install for root)
  community.general.npm:
    name: opencode-ai
    global: true
    state: absent
  when: opencode_cli_remove_npm_global | bool

- name: Ensure user systemd directory exists
  ansible.builtin.file:
    path: "{{ ai_desktop_user_home }}/.config/systemd/user"
    state: directory
    owner: "{{ ai_desktop_user }}"
    group: "{{ ai_desktop_user }}"
    mode: '0755'

- name: Deploy OpenCode CLI auto-update user systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ai_desktop_user_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ ai_desktop_user }}"
    group: "{{ ai_desktop_user }}"
    mode: '0644'
  loop:
    - opencode-cli-update.service
    - opencode-cli-update.timer

- name: Enable OpenCode CLI auto-update user timer
  ansible.builtin.systemd_service:
    name: opencode-cli-update.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  # Units deployed in the same run do not exist yet during check mode
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
  become_user: "{{ ai_desktop_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ai_desktop_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ai_desktop_user_uid }}/bus"

- name: Update OpenCode CLI now
  ansible.builtin.command:
    argv:
      - "{{ opencode_cli_bin }}"
      - upgrade
      - --method
      - curl
  become: true
  become_user: "{{ ai_desktop_user }}"
  register: opencode_cli_update
  changed_when: "'Upgrade complete' in opencode_cli_update.stdout"
  when: not ansible_check_mode
