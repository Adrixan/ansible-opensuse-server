---
# tasks for installing Claude Desktop and keeping it updated from Anthropic's signed apt repository

- name: Ensure keyring directory exists
  ansible.builtin.file:
    path: "{{ claude_desktop_signing_key | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy pinned Claude Desktop repository signing key
  ansible.builtin.copy:
    src: claude-desktop-signing-key.asc
    dest: "{{ claude_desktop_signing_key }}"
    owner: root
    group: root
    mode: '0644'
  register: claude_desktop_key_file

- name: Deploy Claude Desktop update script
  ansible.builtin.copy:
    src: claude-desktop-update.py
    dest: /usr/local/sbin/claude-desktop-update
    owner: root
    group: root
    mode: '0755'
  register: claude_desktop_update_script

- name: Install or update Claude Desktop to the configured version
  ansible.builtin.command:
    argv: "{{ claude_desktop_update_argv + (['--check'] if ansible_check_mode else []) }}"
  vars:
    claude_desktop_update_argv:
      - /usr/local/sbin/claude-desktop-update
      - --repo
      - "{{ claude_desktop_repo_url }}"
      - --key
      - "{{ claude_desktop_signing_key }}"
      - --fingerprint
      - "{{ claude_desktop_signing_key_fingerprint }}"
      - --install-root
      - "{{ claude_desktop_install_root }}"
      - --install-dir
      - "{{ claude_desktop_install_dir }}"
      - --version
      - "{{ claude_desktop_version }}"
      - --keep
      - "{{ claude_desktop_keep_versions | string }}"
  check_mode: false
  register: claude_desktop_update
  # In check mode the script runs with --check, but only once it is actually on disk
  when: not (ansible_check_mode and (claude_desktop_key_file.changed or claude_desktop_update_script.changed))
  changed_when: "'CHANGED:' in claude_desktop_update.stdout"

- name: Create symlink for Claude Desktop executable in /usr/local/bin
  ansible.builtin.file:
    src: "{{ claude_desktop_install_dir }}/claude-desktop"
    dest: /usr/local/bin/claude-desktop
    state: link
    force: true
  when: not ansible_check_mode or (claude_desktop_install_dir + '/claude-desktop') is file

- name: Deploy Claude Desktop auto-update systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - claude-desktop-update.service
    - claude-desktop-update.timer

- name: Enable Claude Desktop auto-update timer
  ansible.builtin.systemd_service:
    name: claude-desktop-update.timer
    enabled: true
    state: started
    daemon_reload: true
  # Units deployed in the same run do not exist yet during check mode
  ignore_errors: "{{ ansible_check_mode }}"
