---
# tasks file for ai_desktop

- name: Ensure extraction and verification utility packages are installed
  ansible.builtin.package:
    name:
      - binutils
      - tar
      - xz
      - zstd
      - gpg2
      - libcrc32c1
    state: present

- name: Include Claude Desktop installation and auto-update tasks
  ansible.builtin.include_tasks: claude_desktop.yml
  when: enable_claude_desktop | default(true) | bool

- name: Include Claude Code installation and auto-update tasks
  ansible.builtin.include_tasks: claude_code.yml
  when: enable_claude_code | default(true) | bool

- name: Include Antigravity Desktop installation and auto-update tasks
  ansible.builtin.include_tasks: antigravity_desktop.yml
  when: enable_antigravity_desktop | default(true) | bool

- name: Include Antigravity CLI installation and auto-update tasks
  ansible.builtin.include_tasks: antigravity_cli.yml
  when: enable_antigravity_cli | default(true) | bool

