---
# tasks for installing Claude Code (native installer) and keeping it updated

- name: Install Claude Code with the official native installer
  ansible.builtin.shell:
    cmd: "set -o pipefail && curl -fsSL {{ claude_code_install_url | quote }} | bash"
    executable: /bin/bash
    creates: "{{ claude_code_bin }}"
  become: true
  become_user: "{{ ai_desktop_user }}"

- name: Check for root-owned npm global Claude Code install
  ansible.builtin.stat:
    path: /usr/local/lib/node_modules/@anthropic-ai/claude-code
  register: claude_code_npm_global

- name: Remove npm global Claude Code (does not self-update and shadows the native install for root)
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: absent
  when:
    - claude_code_remove_npm_global | bool
    - claude_code_npm_global.stat.exists

- name: Check npm global scope directory left behind by the removal
  ansible.builtin.find:
    paths: /usr/local/lib/node_modules/@anthropic-ai
    file_type: any
    hidden: true
  register: claude_code_npm_scope
  failed_when: false

- name: Remove empty npm global @anthropic-ai scope directory
  ansible.builtin.file:
    path: /usr/local/lib/node_modules/@anthropic-ai
    state: absent
  when:
    - claude_code_remove_npm_global | bool
    - claude_code_npm_scope.matched is defined
    - claude_code_npm_scope.matched == 0

- name: Check /usr/bin/claude compatibility symlink
  ansible.builtin.stat:
    path: /usr/bin/claude
    follow: false
  register: claude_code_usr_bin

- name: Remove dangling /usr/bin/claude symlink to the npm global install
  ansible.builtin.file:
    path: /usr/bin/claude
    state: absent
  when:
    - claude_code_remove_npm_global | bool
    - claude_code_usr_bin.stat.islnk | default(false)
    - claude_code_usr_bin.stat.lnk_source | default('') is match('/usr/local/(bin/claude|lib/node_modules/@anthropic-ai/claude-code/)')

- name: Deploy Claude version pruning helper
  ansible.builtin.copy:
    src: claude-prune-versions.py
    dest: "{{ claude_prune_script }}"
    owner: root
    group: root
    mode: '0755'
  register: claude_prune_script_file

- name: Ensure user systemd directory exists
  ansible.builtin.file:
    path: "{{ ai_desktop_user_home }}/.config/systemd/user"
    state: directory
    owner: "{{ ai_desktop_user }}"
    group: "{{ ai_desktop_user }}"
    mode: '0755'

- name: Deploy Claude Code auto-update user systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ai_desktop_user_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ ai_desktop_user }}"
    group: "{{ ai_desktop_user }}"
    mode: '0644'
  loop:
    - claude-code-update.service
    - claude-code-update.timer

- name: Enable Claude Code auto-update user timer
  ansible.builtin.systemd_service:
    name: claude-code-update.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  # Units deployed in the same run do not exist yet during check mode
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
  become_user: "{{ ai_desktop_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ai_desktop_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ai_desktop_user_uid }}/bus"

- name: Update Claude Code now
  ansible.builtin.command:
    cmd: "{{ claude_code_bin }} update"
  become: true
  become_user: "{{ ai_desktop_user }}"
  environment:
    DISABLE_AUTOUPDATER: ""
  register: claude_code_update
  changed_when: "'is up to date' not in claude_code_update.stdout"
  when: not ansible_check_mode

- name: Prune superseded native Claude Code versions
  ansible.builtin.command:
    argv: >-
      {{ [claude_prune_script, '--dir', claude_code_versions_dir, '--keep-target', claude_code_bin,
          '--keep', claude_code_keep_versions | string] + (['--check'] if ansible_check_mode else []) }}
  become: true
  become_user: "{{ ai_desktop_user }}"
  check_mode: false
  register: claude_code_prune
  changed_when: "'CHANGED:' in claude_code_prune.stdout"
  when: not (ansible_check_mode and claude_prune_script_file.changed)

- name: Prune superseded Claude Code versions bundled with Claude Desktop
  ansible.builtin.command:
    argv: >-
      {{ [claude_prune_script, '--dir', claude_code_desktop_bundled_dir,
          '--keep', claude_code_keep_versions | string] + (['--check'] if ansible_check_mode else []) }}
  become: true
  become_user: "{{ ai_desktop_user }}"
  check_mode: false
  register: claude_code_bundled_prune
  changed_when: "'CHANGED:' in claude_code_bundled_prune.stdout"
  when: not (ansible_check_mode and claude_prune_script_file.changed)
