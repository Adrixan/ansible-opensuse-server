---
# Node.js MCP servers on their latest release: one npm prefix per server, the whole tree updated on
# every run, npm overrides for vulnerable transitive dependencies and an install-script allowlist;
# npm audit gates the role.

- name: Create the Node.js MCP server prefixes
  ansible.builtin.file:
    path: "{{ ai_workstation_mcp_node_dir }}/{{ item.name }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ ai_workstation_mcp_node_servers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write the Node.js MCP server manifests (latest release)
  ansible.builtin.copy:
    dest: "{{ ai_workstation_mcp_node_dir }}/{{ item.name }}/package.json"
    content: >-
      {{ {'name': item.name + '-mcp', 'private': true,
          'dependencies': {item.package: 'latest'}}
         | combine({'overrides': item.overrides} if item.overrides is defined else {})
         | combine({'allowScripts': item.allow_scripts} if item.allow_scripts is defined else {})
         | to_nice_json }}
    owner: root
    group: root
    mode: '0644'
  loop: "{{ ai_workstation_mcp_node_servers }}"
  loop_control:
    label: "{{ item.name }}"
  register: ai_workstation_mcp_node_manifests

# `npm update` resolves `latest` past the lockfile and lifts every transitive dependency to the newest
# release its range allows; a fresh prefix gets `npm install` first
- name: Install or update the Node.js MCP servers (install scripts only where allowlisted)
  ansible.builtin.command:
    argv: >-
      {{ ['npm', 'install' if not (ai_workstation_mcp_node_dir + '/' + item.item.name + '/node_modules') is exists else 'update',
          '--omit=dev', '--no-fund', '--no-audit']
         + ([] if item.item.allow_scripts is defined else ['--ignore-scripts']) }}
    chdir: "{{ ai_workstation_mcp_node_dir }}/{{ item.item.name }}"
  loop: "{{ ai_workstation_mcp_node_manifests.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: ai_workstation_mcp_node_update
  when: not ansible_check_mode
  changed_when: "'up to date' not in ai_workstation_mcp_node_update.stdout"
  environment:
    PUPPETEER_SKIP_DOWNLOAD: "1"

- name: Audit the Node.js MCP server dependency trees (fails on any known vulnerability)
  ansible.builtin.command:
    argv: [npm, audit, --omit=dev, --audit-level=low]
    chdir: "{{ ai_workstation_mcp_node_dir }}/{{ item.name }}"
  loop: "{{ ai_workstation_mcp_node_servers }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  check_mode: false
  when: (ai_workstation_mcp_node_dir + '/' + item.name + '/node_modules') is exists

- name: Install the sandbox-preserving Chromium wrapper for MCP-driven browsers
  ansible.builtin.copy:
    dest: "{{ ai_workstation_mcp_chromium }}"
    content: |
      #!/bin/sh
      # Managed by Ansible (ai_workstation): drops --no-sandbox, which Lighthouse, the accessibility
      # scanner and Playwright pass by default, so pages they load stay inside the Chromium sandbox
      for arg do
        shift
        [ "$arg" = "--no-sandbox" ] || set -- "$@" "$arg"
      done
      exec /usr/bin/chromium "$@"
    owner: root
    group: root
    mode: '0755'

- name: Install the Node.js MCP server wrappers
  ansible.builtin.copy:
    dest: "/usr/local/bin/{{ item.bin }}"
    content: |
      #!/bin/sh
      # Managed by Ansible (ai_workstation): {{ item.package }} (latest release) from {{ ai_workstation_mcp_node_dir }}/{{ item.name }}
      {% for key, value in (item.env | default({})).items() %}
      export {{ key }}={{ value | quote }}
      {% endfor %}
      exec {{ ai_workstation_mcp_node_dir }}/{{ item.name }}/node_modules/.bin/{{ item.bin }} "$@"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ ai_workstation_mcp_node_servers }}"
  loop_control:
    label: "{{ item.name }}"
