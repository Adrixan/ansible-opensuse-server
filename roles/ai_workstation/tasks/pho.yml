---
# Phở Research Tools MCP server (Streamable HTTP) from the upstream default branch, loopback only

# The dependency update rewrites the tracked lockfile and workspace file; restore them first so the
# checkout fast-forwards cleanly (the local entry point is untracked)
- name: Restore the upstream lockfile and workspace file before updating the checkout
  ansible.builtin.command:
    argv: [git, checkout, --, pnpm-lock.yaml, pnpm-workspace.yaml]
    chdir: "{{ ai_workstation_pho_dir }}"
  become: true
  become_user: "{{ ai_workstation_user }}"
  changed_when: false
  when:
    - ai_workstation_pho | bool
    - not ansible_check_mode
    - (ai_workstation_pho_dir + '/.git') is exists

- name: Check out Phở Research Tools at the latest upstream commit
  ansible.builtin.git:
    repo: "{{ ai_workstation_pho_repo }}"
    dest: "{{ ai_workstation_pho_dir }}"
    version: "{{ ai_workstation_pho_version }}"
    update: true
    # Check mode skips the restore above, so the lockfile rewritten by the last run would block it
    force: "{{ ansible_check_mode }}"
  become: true
  become_user: "{{ ai_workstation_user }}"
  register: ai_workstation_pho_checkout
  when: ai_workstation_pho | bool

- name: Deploy the loopback-only Phở entry point
  ansible.builtin.copy:
    src: pho-mcp-local.ts
    dest: "{{ ai_workstation_pho_dir }}/apps/mcp/src/local.ts"
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0644'
  register: ai_workstation_pho_entry
  when: ai_workstation_pho | bool

- name: Update Phở runtime dependencies to the latest versions their ranges allow (no install scripts)
  ansible.builtin.script:
    cmd: >-
      pho-update-deps.sh {{ ai_workstation_pho_dir | quote }} {{ ai_workstation_pho_pnpm | quote }}
      {% for name, spec in ai_workstation_pho_overrides.items() %}{{ (name + '=' + spec) | quote }} {% endfor %}
    executable: /bin/bash
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    HOME: "{{ ai_workstation_user_home }}"
  register: ai_workstation_pho_deps
  when:
    - ai_workstation_pho | bool
    - not ansible_check_mode
  changed_when: "'lockfile changed' in ai_workstation_pho_deps.stdout"

- name: Audit the Phở dependency tree (fails on any known vulnerability)
  ansible.builtin.command:
    argv: [npm, exec, --yes, "--package={{ ai_workstation_pho_pnpm }}", --, pnpm, audit, --prod, --audit-level=low]
    chdir: "{{ ai_workstation_pho_dir }}"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    HOME: "{{ ai_workstation_user_home }}"
    npm_config_manage_package_manager_versions: "false"
  changed_when: false
  check_mode: false
  when:
    - ai_workstation_pho | bool
    - (ai_workstation_pho_dir + '/node_modules') is exists

- name: Deploy the Phở user systemd unit
  ansible.builtin.template:
    src: pho-research-tools.service.j2
    dest: "{{ ai_workstation_user_home }}/.config/systemd/user/pho-research-tools.service"
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0644'
  register: ai_workstation_pho_unit
  when: ai_workstation_pho | bool

- name: Enable and start the Phở user service
  ansible.builtin.systemd_service:
    name: pho-research-tools.service
    scope: user
    enabled: true
    state: "{{ 'restarted' if (ai_workstation_pho_unit.changed or ai_workstation_pho_checkout.changed or ai_workstation_pho_entry.changed or ai_workstation_pho_deps.changed | default(false)) else 'started' }}"
    daemon_reload: true
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ai_workstation_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ai_workstation_user_uid }}/bus"
  when:
    - ai_workstation_pho | bool
    - not ansible_check_mode
