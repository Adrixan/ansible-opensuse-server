---
- name: Ensure target configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0755'
  loop:
    - "{{ ai_workstation_user_home }}/.claude"
    - "{{ ai_workstation_user_home }}/.gemini"
    - "{{ ai_workstation_user_home }}/.gemini/config"
    - "{{ ai_workstation_user_home }}/.config/opencode"

# ~/.config/ai/AGENTS.md is owned by yadm; the template only bootstraps machines without it
- name: Deploy standalone core AGENTS.md instructions if missing
  ansible.builtin.template:
    src: AGENTS.md.j2
    dest: "{{ ai_workstation_user_home }}/.config/ai/AGENTS.md"
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0644'
    force: false

# Relative targets, identical to the symlinks tracked in yadm
- name: Create global instruction symlinks for AI harnesses
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ ai_workstation_user_home }}/{{ item.dest }}"
    state: link
    force: yes
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
  loop:
    - { dest: .claude/CLAUDE.md, src: ../.config/ai/AGENTS.md }
    - { dest: .gemini/GEMINI.md, src: ../.config/ai/AGENTS.md }
    - { dest: .config/opencode/AGENTS.md, src: ../ai/AGENTS.md }
  loop_control:
    label: "{{ item.dest }}"

- name: Link personal branding document to ~/.config/ai/BRANDING.md
  ansible.builtin.file:
    src: "{{ ai_workstation_user_home }}/Obsidian/Adrixan/Freelancing/Branding.md"
    dest: "{{ ai_workstation_user_home }}/.config/ai/BRANDING.md"
    state: link
    force: yes
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
