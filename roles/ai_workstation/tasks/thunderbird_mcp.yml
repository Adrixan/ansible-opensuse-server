---
# Thunderbird MCP: stdio bridge for the thunderbird-mcp add-on, which serves its tools on
# 127.0.0.1 from inside Thunderbird. The add-on (.xpi) is placed next to the bridge for a manual
# install (Thunderbird > Add-ons > Install Add-on From File); account and tool access are set there.

- name: Install the Thunderbird MCP bridge
  when: ai_workstation_thunderbird_mcp | bool
  block:
    - name: Create the Thunderbird MCP directory
      ansible.builtin.file:
        path: "{{ ai_workstation_thunderbird_mcp_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Resolve the latest Thunderbird MCP release
      ansible.builtin.include_role:
        name: github_release
      vars:
        github_release_repo: "{{ ai_workstation_thunderbird_mcp_repo }}"
        github_release_asset: '^thunderbird-mcp-.*\.xpi$'

    - name: Download the Thunderbird MCP bridge files of the release
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/{{ ai_workstation_thunderbird_mcp_repo }}/{{ github_release.tag }}/{{ item }}"
        dest: "{{ ai_workstation_thunderbird_mcp_dir }}/{{ item }}"
        force: true
        owner: root
        group: root
        mode: '0644'
      loop: "{{ ai_workstation_thunderbird_mcp_files }}"

    - name: Download the Thunderbird MCP add-on (release digest verified)
      ansible.builtin.get_url:
        url: "{{ github_release.asset_url }}"
        dest: "{{ ai_workstation_thunderbird_mcp_dir }}/{{ github_release.asset_name }}"
        checksum: "sha256:{{ github_release.sha256 }}"
        owner: root
        group: root
        mode: '0644'

    - name: Find add-on files of older Thunderbird MCP releases
      ansible.builtin.find:
        paths: "{{ ai_workstation_thunderbird_mcp_dir }}"
        patterns: ["thunderbird-mcp-*.xpi"]
        excludes: ["{{ github_release.asset_name }}"]
      register: ai_workstation_thunderbird_old_xpi

    - name: Remove add-on files of older Thunderbird MCP releases
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ ai_workstation_thunderbird_old_xpi.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Install the Thunderbird MCP bridge wrapper
      ansible.builtin.copy:
        dest: /usr/local/bin/thunderbird-mcp
        content: |
          #!/bin/sh
          # Managed by Ansible (ai_workstation): thunderbird-mcp {{ github_release.tag }} bridge from {{ ai_workstation_thunderbird_mcp_dir }}
          exec /usr/bin/node {{ ai_workstation_thunderbird_mcp_dir }}/mcp-bridge.cjs "$@"
        owner: root
        group: root
        mode: '0755'
