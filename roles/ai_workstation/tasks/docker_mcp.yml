---
# The docker MCP server and its read-only docker-socket-proxy were dropped on Peter's review (2026-11-18).
# Removes the proxy stack where an earlier run deployed it; docker itself and docker-compose@ stay.

- name: Check for the retired docker-socket-proxy stack
  ansible.builtin.stat:
    path: /etc/docker-compose/docker-socket-proxy
  register: ai_workstation_docker_proxy_dir

- name: Remove the retired docker-socket-proxy
  when: ai_workstation_docker_proxy_dir.stat.exists
  block:
    - name: Stop and disable docker-socket-proxy
      ansible.builtin.systemd_service:
        name: docker-compose@docker-socket-proxy
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the docker-socket-proxy compose directory
      ansible.builtin.file:
        path: /etc/docker-compose/docker-socket-proxy
        state: absent

    - name: Remove the docker-socket-proxy images
      ansible.builtin.shell: |
        set -o pipefail
        ids=$(docker images --format '{{ '{{' }}.Repository{{ '}}' }} {{ '{{' }}.ID{{ '}}' }}' | awk '$1 == "{{ ai_workstation_docker_mcp_proxy_image }}" {print $2}')
        [ -z "$ids" ] && exit 0
        docker rmi -f $ids >/dev/null && echo removed
      args:
        executable: /bin/bash
      register: ai_workstation_docker_proxy_rmi
      changed_when: "'removed' in ai_workstation_docker_proxy_rmi.stdout"
      failed_when: false
