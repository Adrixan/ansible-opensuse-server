---
# Exposes a GET/HEAD-only Docker API on 127.0.0.1 so the docker MCP server cannot mutate
# containers, regardless of which tools it offers. Skipped where Docker is not installed.

- name: Check for Docker and the docker-compose@ systemd unit
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/docker
    - /etc/systemd/system/docker-compose@.service
  register: ai_workstation_docker_presence

- name: Deploy docker-socket-proxy
  when:
    - ai_workstation_docker_mcp_proxy | bool
    - ai_workstation_docker_presence.results | map(attribute='stat.exists') | min
  block:
    - name: Resolve the latest docker-socket-proxy release (image tag)
      ansible.builtin.include_role:
        name: github_release
      vars:
        github_release_repo: "{{ ai_workstation_docker_mcp_proxy_repo }}"

    - name: Create docker-compose directory for docker-socket-proxy
      ansible.builtin.file:
        path: /etc/docker-compose/docker-socket-proxy
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Upload docker-socket-proxy docker-compose configuration
      ansible.builtin.template:
        src: docker-socket-proxy.compose.yml.j2
        dest: /etc/docker-compose/docker-socket-proxy/docker-compose.yml
        owner: root
        group: root
        mode: '0644'
      register: ai_workstation_docker_proxy_compose

    - name: Start and enable docker-socket-proxy
      ansible.builtin.systemd_service:
        name: docker-compose@docker-socket-proxy
        state: "{{ 'restarted' if ai_workstation_docker_proxy_compose.changed else 'started' }}"
        enabled: true
      when: not ansible_check_mode
