---
# MCP server runtimes only. Harness configs are owned by yadm (see defaults/main.yml);
# this file installs what they reference and renders the yadm templates with the secrets.

- name: Install Node.js MCP servers via global npm
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: "{{ ai_workstation_mcp_npm_state }}"
  loop: "{{ ai_workstation_mcp_npm_packages }}"

- name: List installed uv tools
  ansible.builtin.command:
    argv: [uv, tool, list]
  become: true
  become_user: "{{ ai_workstation_user }}"
  register: ai_workstation_uv_tool_list
  changed_when: false
  check_mode: false

- name: Ensure the uv override directory exists
  ansible.builtin.file:
    path: "{{ ai_workstation_mcp_uv_overrides_dir }}"
    state: directory
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0755'

- name: Write uv override files (fixes for vulnerable or incompatible transitive dependencies)
  ansible.builtin.copy:
    dest: "{{ ai_workstation_mcp_uv_overrides_dir }}/{{ item.name }}.txt"
    content: "{{ item.overrides | join('\n') }}\n"
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0644'
  loop: "{{ ai_workstation_mcp_uv_tools | selectattr('overrides', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: ai_workstation_uv_overrides

# Tools released only on GitHub install from their latest release tag
- name: Resolve the latest GitHub release of GitHub-only uv tools
  ansible.builtin.include_role:
    name: github_release
  vars:
    github_release_repo: "{{ ai_workstation_uv_github_tool.github_release }}"
  loop: "{{ ai_workstation_mcp_uv_tools | selectattr('github_release', 'defined') | list }}"
  loop_control:
    loop_var: ai_workstation_uv_github_tool
    label: "{{ ai_workstation_uv_github_tool.name }}"

- name: Record the release tags of GitHub-only uv tools
  ansible.builtin.set_fact:
    ai_workstation_uv_git_tags: "{{ (ai_workstation_uv_git_tags | default({})) | combine({item.name: github_release.tag}) }}"
  loop: "{{ ai_workstation_mcp_uv_tools | selectattr('github_release', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  when: github_release is defined

# The overrides are recorded in the uv tool receipt, so `uv tool upgrade --all` keeps them; a
# GitHub-only tool is reinstalled when its latest release tag differs from the installed version
- name: Install Python MCP servers as uv tools
  ansible.builtin.command:
    argv: >-
      {{ ['uv', 'tool', 'install']
         + (['--python', item.python] if item.python is defined else [])
         + (['--overrides', ai_workstation_mcp_uv_overrides_dir + '/' + item.name + '.txt'] if item.overrides is defined else [])
         + (['--force'] if item.name in ai_workstation_uv_overrides_changed or ai_workstation_uv_git_outdated | bool else [])
         + ([item.source] if item.source is defined
            else ['git+https://github.com/' + item.github_release + '@' + ai_workstation_uv_git_tags[item.name]] if item.github_release is defined
            else [item.name]) }}
  become: true
  become_user: "{{ ai_workstation_user }}"
  loop: "{{ ai_workstation_mcp_uv_tools }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    ai_workstation_uv_installed: "{{ dict(ai_workstation_uv_tool_list.stdout | regex_findall('(?m)^(\\S+) v(\\S+)')) }}"
    ai_workstation_uv_overrides_changed: "{{ ai_workstation_uv_overrides.results | selectattr('changed') | map(attribute='item.name') | list }}"
    ai_workstation_uv_git_outdated: >-
      {{ item.github_release is defined
         and (ai_workstation_uv_git_tags[item.name] | regex_replace('^v', '')) != ai_workstation_uv_installed.get(item.name, '') }}
  when: >-
    item.name not in ai_workstation_uv_installed
    or item.name in ai_workstation_uv_overrides_changed
    or ai_workstation_uv_git_outdated | bool

- name: Upgrade all uv tools to their latest releases
  ansible.builtin.command:
    argv: [uv, tool, upgrade, --all]
  become: true
  become_user: "{{ ai_workstation_user }}"
  register: ai_workstation_uv_upgrade
  changed_when: "'Updated' in (ai_workstation_uv_upgrade.stdout + ai_workstation_uv_upgrade.stderr)"
  when: not ansible_check_mode

- name: Ensure the openroute MCP route directory exists
  ansible.builtin.file:
    path: "{{ ai_workstation_openroute_routes_dir }}"
    state: directory
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0755'

- name: Ensure the private Garmin activity file directory exists
  ansible.builtin.file:
    path: "{{ ai_workstation_garmin_data_dir }}"
    state: directory
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0700'

- name: Ensure user systemd directory exists
  ansible.builtin.file:
    path: "{{ ai_workstation_user_home }}/.config/systemd/user"
    state: directory
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0755'

- name: Deploy MCP tools auto-update user systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ ai_workstation_user_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0644'
  loop:
    - ai-mcp-tools-update.service
    - ai-mcp-tools-update.timer

- name: Enable MCP tools auto-update user timer
  ansible.builtin.systemd_service:
    name: ai-mcp-tools-update.timer
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  # Units deployed in the same run do not exist yet during check mode
  ignore_errors: "{{ ansible_check_mode }}"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ai_workstation_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ai_workstation_user_uid }}/bus"

- name: Ensure memory MCP knowledge graph directory exists
  ansible.builtin.file:
    path: "{{ ai_workstation_mcp_memory_dir }}"
    state: directory
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0700'

- name: Remove legacy user-scope MCP servers from ~/.claude.json
  ansible.builtin.command:
    argv: "{{ ['python3', role_path + '/files/purge_claude_mcp.py', ai_workstation_user_home + '/.claude.json'] + ai_workstation_legacy_claude_mcp_servers }}"
  become: true
  become_user: "{{ ai_workstation_user }}"
  register: claude_mcp_result
  changed_when: "'CONFIGURED' in claude_mcp_result.stdout"
  when: not ansible_check_mode

- name: Check for yadm repository
  ansible.builtin.stat:
    path: "{{ ai_workstation_user_home }}/.local/share/yadm/repo.git"
  register: ai_workstation_yadm_repo

- name: Render yadm templates (MCP configs) with secrets from ~/.config/ai/env
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077
      # Plain git: any yadm subcommand would trigger auto-alt before the checksum is taken
      files=$(git --git-dir="$(yadm introspect repo)" ls-files | sed -n 's/##template$//p')
      before=$(cd "$HOME" && sha256sum $files 2>/dev/null || true)
      yadm alt >/dev/null
      cd "$HOME" && chmod 0600 $files
      after=$(sha256sum $files)
      [ "$before" = "$after" ] || echo CHANGED
    executable: /bin/bash
    chdir: "{{ ai_workstation_user_home }}"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    HOME: "{{ ai_workstation_user_home }}"
    GITHUB_PERSONAL_ACCESS_TOKEN: "{{ ai_workstation_github_token }}"
    ANTHROPIC_WORKSPACE_ID: "{{ ai_workstation_anthropic_workspace_id }}"
    NEXTCLOUD_HOST: "{{ ai_workstation_nextcloud_host }}"
    NEXTCLOUD_USERNAME: "{{ ai_workstation_nextcloud_username }}"
    NEXTCLOUD_PASSWORD: "{{ ai_workstation_nextcloud_password }}"
    DRAGTOKENS_API_KEY: "{{ ai_workstation_dragtokens_api_key }}"
    NASA_API_KEY: "{{ ai_workstation_nasa_api_key }}"
    OPENROUTESERVICE_API_KEY: "{{ ai_workstation_openroute_api_key }}"
  register: ai_workstation_yadm_alt
  changed_when: "'CHANGED' in ai_workstation_yadm_alt.stdout"
  no_log: true
  when:
    - ai_workstation_yadm_repo.stat.exists
    - not ansible_check_mode

- name: Check for Claude Code CLI and the yadm-tracked workstation plugin marketplace
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ ai_workstation_claude_bin }}"
    - "{{ ai_workstation_claude_marketplace_dir }}/.claude-plugin/marketplace.json"
  register: ai_workstation_claude_plugin_prereqs

- name: Register the workstation MCP plugins with Claude Code
  when: ai_workstation_claude_plugin_prereqs.results | map(attribute='stat.exists') | min
  block:
    - name: List installed Claude Code plugins
      ansible.builtin.command:
        argv: ["{{ ai_workstation_claude_bin }}", plugin, list, --json]
      become: true
      become_user: "{{ ai_workstation_user }}"
      register: ai_workstation_claude_plugins
      changed_when: false
      check_mode: false

    - name: List known Claude Code plugin marketplaces
      ansible.builtin.command:
        argv: ["{{ ai_workstation_claude_bin }}", plugin, marketplace, list, --json]
      become: true
      become_user: "{{ ai_workstation_user }}"
      register: ai_workstation_claude_marketplaces
      changed_when: false
      check_mode: false

    - name: Add the yadm-tracked workstation plugin marketplace
      ansible.builtin.command:
        argv: ["{{ ai_workstation_claude_bin }}", plugin, marketplace, add, "{{ ai_workstation_claude_marketplace_dir }}"]
      become: true
      become_user: "{{ ai_workstation_user }}"
      when: "'workstation' not in (ai_workstation_claude_marketplaces.stdout | from_json | map(attribute='name') | list)"

    - name: Install the workstation MCP plugins
      ansible.builtin.command:
        argv: ["{{ ai_workstation_claude_bin }}", plugin, install, "{{ item }}@workstation", --scope, user]
      become: true
      become_user: "{{ ai_workstation_user }}"
      loop: "{{ ai_workstation_claude_plugins_list }}"
      when: "(item + '@workstation') not in (ai_workstation_claude_plugins.stdout | from_json | map(attribute='id') | list)"

    - name: Read the yadm-tracked workstation plugin versions
      ansible.builtin.slurp:
        src: "{{ ai_workstation_claude_marketplace_dir }}/plugins/{{ item }}/.claude-plugin/plugin.json"
      loop: "{{ ai_workstation_claude_plugins_list }}"
      register: ai_workstation_claude_plugin_manifests

    # Claude Code runs plugins from a versioned cache copy; refresh it when the yadm copy is newer
    - name: Update cached workstation plugins to the yadm version
      ansible.builtin.shell:
        cmd: >-
          {{ ai_workstation_claude_bin | quote }} plugin marketplace update workstation
          && {{ ai_workstation_claude_bin | quote }} plugin update {{ (item.item + '@workstation') | quote }} --scope user
        executable: /bin/bash
      become: true
      become_user: "{{ ai_workstation_user }}"
      loop: "{{ ai_workstation_claude_plugin_manifests.results }}"
      loop_control:
        label: "{{ item.item }}"
      vars:
        _installed: "{{ ai_workstation_claude_plugins.stdout | from_json | selectattr('id', 'equalto', item.item + '@workstation') | map(attribute='version') | first | default('') }}"
        _source: "{{ (item.content | b64decode | from_json).version }}"
      when:
        - _installed | length > 0
        - _installed is version(_source, '<')

- name: Install the Node.js MCP servers (latest releases)
  ansible.builtin.import_tasks: mcp_node.yml

- name: Serve Phở Research Tools on loopback
  ansible.builtin.import_tasks: pho.yml

- name: Serve Obsidian Hybrid Search per vault on loopback
  ansible.builtin.import_tasks: obsidian_search.yml

- name: Serve Grounded Docs on loopback
  ansible.builtin.import_tasks: docs_mcp.yml

- name: Configure read-only Docker API proxy for the docker MCP server
  ansible.builtin.import_tasks: docker_mcp.yml

- name: Remove the retired SearXNG
  ansible.builtin.import_tasks: searxng.yml

- name: Install the Thunderbird MCP bridge
  ansible.builtin.import_tasks: thunderbird_mcp.yml

- name: Serve the stateless MCP servers once on loopback for all sessions
  ansible.builtin.import_tasks: mcp_shared.yml
  when: ai_workstation_mcp_shared
