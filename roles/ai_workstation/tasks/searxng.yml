---
# SearXNG and its MCP server are retired (2026-10-23: too resource-intensive on schulpc);
# web search comes from the duckduckgo-mcp-server uv tool. These tasks remove what earlier
# runs deployed and can be dropped once every machine has run the role once.

- name: Check for a deployed SearXNG
  ansible.builtin.stat:
    path: /etc/docker-compose/searxng/docker-compose.yml
  register: ai_workstation_searxng_compose

- name: Remove the SearXNG container and its images
  when: ai_workstation_searxng_compose.stat.exists
  block:
    - name: Stop and disable SearXNG
      ansible.builtin.systemd_service:
        name: docker-compose@searxng
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove the SearXNG container and the locally built image
      ansible.builtin.command:
        argv: [docker, compose, down, --rmi, all, --remove-orphans]
        chdir: /etc/docker-compose/searxng
      register: ai_workstation_searxng_down
      changed_when: "'Removed' in ai_workstation_searxng_down.stderr"
      failed_when: false

    - name: Remove the upstream SearXNG base images
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          ids=$(docker images --quiet searxng/searxng | sort -u);
          [ -z "$ids" ] && exit 0;
          docker rmi $ids >/dev/null && echo removed
        executable: /bin/bash
      register: ai_workstation_searxng_rmi
      changed_when: "'removed' in ai_workstation_searxng_rmi.stdout"
      failed_when: false

- name: Remove the SearXNG compose directory, secret key included
  ansible.builtin.file:
    path: /etc/docker-compose/searxng
    state: absent

- name: Remove the retired searxng MCP server
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ai_workstation_mcp_node_dir }}/searxng"
    - /usr/local/bin/mcp-searxng
