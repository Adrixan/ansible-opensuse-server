---
- name: Ensure ~/.config/ai directory exists
  ansible.builtin.file:
    path: "{{ ai_workstation_user_home }}/.config/ai"
    state: directory
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0700'

- name: Check if ~/.config/ai/env exists
  ansible.builtin.stat:
    path: "{{ ai_workstation_user_home }}/.config/ai/env"
  register: ai_workstation_env_file

- name: Read existing ~/.config/ai/env if present
  ansible.builtin.slurp:
    src: "{{ ai_workstation_user_home }}/.config/ai/env"
  register: ai_workstation_env_content
  when: ai_workstation_env_file.stat.exists

- name: Populate facts from existing ~/.config/ai/env if tokens not provided
  ansible.builtin.set_fact:
    ai_workstation_github_token: "{{ (ai_workstation_env_content.content | b64decode | regex_findall('export GITHUB_PERSONAL_ACCESS_TOKEN=\"([^\"]*)\"') | first) if (ai_workstation_github_token | length == 0 and (ai_workstation_env_content.content | b64decode | regex_findall('export GITHUB_PERSONAL_ACCESS_TOKEN=\"([^\"]*)\"') | length > 0)) else ai_workstation_github_token }}"
    ai_workstation_anthropic_workspace_id: "{{ (ai_workstation_env_content.content | b64decode | regex_findall('export ANTHROPIC_WORKSPACE_ID=\"([^\"]*)\"') | first) if (ai_workstation_anthropic_workspace_id | length == 0 and (ai_workstation_env_content.content | b64decode | regex_findall('export ANTHROPIC_WORKSPACE_ID=\"([^\"]*)\"') | length > 0)) else ai_workstation_anthropic_workspace_id }}"
  when: ai_workstation_env_file.stat.exists

- name: Populate Nextcloud and DragTokens secrets from existing ~/.config/ai/env if not provided
  ansible.builtin.set_fact:
    "{{ item.fact }}": "{{ (_existing | first) if (lookup('vars', item.fact) | length == 0 and _existing | length > 0) else lookup('vars', item.fact) }}"
  vars:
    _existing: "{{ ai_workstation_env_content.content | b64decode | regex_findall('export ' + item.var + '=\"([^\"]*)\"') }}"
  loop:
    - { var: NEXTCLOUD_HOST, fact: ai_workstation_nextcloud_host }
    - { var: NEXTCLOUD_USERNAME, fact: ai_workstation_nextcloud_username }
    - { var: NEXTCLOUD_PASSWORD, fact: ai_workstation_nextcloud_password }
    - { var: DRAGTOKENS_API_KEY, fact: ai_workstation_dragtokens_api_key }
  loop_control:
    label: "{{ item.var }}"
  no_log: true
  when: ai_workstation_env_file.stat.exists

- name: Check if ~/.local/share/opencode/auth.json exists
  ansible.builtin.stat:
    path: "{{ ai_workstation_user_home }}/.local/share/opencode/auth.json"
  register: ai_workstation_opencode_auth_file

- name: Read existing ~/.local/share/opencode/auth.json if present
  ansible.builtin.slurp:
    src: "{{ ai_workstation_user_home }}/.local/share/opencode/auth.json"
  register: ai_workstation_opencode_auth_content
  when: ai_workstation_opencode_auth_file.stat.exists

- name: Populate Anthropic API key from opencode auth.json if not provided
  ansible.builtin.set_fact:
    ai_workstation_anthropic_api_key: "{{ ((ai_workstation_opencode_auth_content.content | b64decode | from_json).anthropic.key) if (ai_workstation_anthropic_api_key | length == 0 and (ai_workstation_opencode_auth_content.content | b64decode | from_json).anthropic.key is defined) else ai_workstation_anthropic_api_key }}"
  when: ai_workstation_opencode_auth_file.stat.exists and (ai_workstation_anthropic_api_key | length == 0)

- name: Validate secrets are safe inside double-quoted shell exports
  ansible.builtin.assert:
    that: >-
      [ai_workstation_github_token, ai_workstation_anthropic_workspace_id,
      ai_workstation_nextcloud_host, ai_workstation_nextcloud_username, ai_workstation_nextcloud_password,
      ai_workstation_dragtokens_api_key]
      | select('search', '[\"$`\\\\]') | list | length == 0
    fail_msg: "A secret contains a double quote, dollar sign, backtick or backslash, which ~/.config/ai/env cannot hold safely"
    quiet: true
  no_log: true

- name: Deploy unified AI environment configuration file
  ansible.builtin.template:
    src: ai_env.j2
    dest: "{{ ai_workstation_user_home }}/.config/ai/env"
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0600'

- name: Ensure ~/.config/ai/env is sourced in ~/.zshrc
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.zshrc"
    line: '[ -f "$HOME/.config/ai/env" ] && source "$HOME/.config/ai/env"'
    state: present
    create: yes
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0644'

- name: Ensure ~/.config/ai/env is sourced in ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.bashrc"
    line: '[ -f "$HOME/.config/ai/env" ] && source "$HOME/.config/ai/env"'
    state: present
    create: yes
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0644'

- name: Ensure ~/.config/git directory exists
  ansible.builtin.file:
    path: "{{ ai_workstation_user_home }}/.config/git"
    state: directory
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0755'

- name: Ensure .scratch/ is ignored in global gitignore
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.config/git/ignore"
    line: ".scratch/"
    state: present
    create: yes
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0644'
