---
# tasks file for ai_workstation
- name: Install AI workstation system package dependencies
  ansible.builtin.import_tasks: packages.yml

- name: Configure unified AI shell environment
  ansible.builtin.import_tasks: environment.yml

- name: Configure unified MCP servers across harnesses
  ansible.builtin.import_tasks: mcp.yml

- name: Configure local TLS 1.3 ECH reverse proxy for DragTokens
  ansible.builtin.import_tasks: dragtokens_ech_proxy.yml

- name: Configure remote control defaults across harnesses
  ansible.builtin.import_tasks: remote_control.yml

- name: Clean up legacy and redundant AI files
  ansible.builtin.import_tasks: cleanup.yml
