---
- name: Remove orphaned code/.agents/skills directory
  ansible.builtin.file:
    path: "{{ ai_workstation_user_home }}/code/.agents/skills"
    state: absent

- name: Clean up legacy gateway exports from ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.bashrc"
    regexp: "{{ ai_workstation_claude_legacy_env_regexp }}"
    state: absent

- name: Clean up legacy gateway exports from ~/.zshrc
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.zshrc"
    regexp: "{{ ai_workstation_claude_legacy_env_regexp }}"
    state: absent

# Purges only the legacy gateway variables inside "env": the env block itself is yadm's and carries
# live flags (CLAUDE_CODE_EXPERIMENTAL_CODE_MODE, DISABLE_AUTOUPDATER). Deleting the whole key wiped
# them on every nightly run (2026-11-20).
- name: Purge legacy gateway variables and model overrides from ~/.claude/settings.json
  ansible.builtin.command:
    argv: "{{ ['python3', '-I', role_path + '/files/claude_settings_sanitize.py', ai_workstation_user_home + '/.claude/settings.json'] + ai_workstation_claude_legacy_env_keys }}"
  become: true
  become_user: "{{ ai_workstation_user }}"
  register: sanitize_claude_settings
  changed_when: "'CHANGED' in sanitize_claude_settings.stdout"
  when: not ansible_check_mode

- name: Clean up legacy gateway exports from ~/.profile
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.profile"
    regexp: "{{ ai_workstation_claude_legacy_env_regexp }}"
    state: absent

- name: Check if ~/.config/zsh/env exists
  ansible.builtin.stat:
    path: "{{ ai_workstation_user_home }}/.config/zsh/env"
  register: ai_workstation_zsh_env_file

- name: Clean up legacy gateway exports from ~/.config/zsh/env
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.config/zsh/env"
    regexp: "{{ ai_workstation_claude_legacy_env_regexp }}"
    state: absent
  when: ai_workstation_zsh_env_file.stat.exists

- name: Purge old Claude backup and doctor files
  ansible.builtin.shell: |
    find "{{ ai_workstation_user_home }}/.claude/backups" -type f -name ".claude.json.backup.*" -mtime +7 -delete 2>/dev/null || true
    rm -f "{{ ai_workstation_user_home }}/.claude/settings.json.bak"* "{{ ai_workstation_user_home }}/.claude.json.bak"* 2>/dev/null || true
  args:
    executable: /bin/bash
  changed_when: false

- name: Check if ~/.config/zsh/aliases exists
  ansible.builtin.stat:
    path: "{{ ai_workstation_user_home }}/.config/zsh/aliases"
  register: ai_workstation_zsh_aliases_file

- name: Clean up custom model aliases from ~/.config/zsh/aliases
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.config/zsh/aliases"
    regexp: '^alias (claude|opencode)-(max|plus|flash|deepseek|deepseek-flash|glm)='
    state: absent
  when: ai_workstation_zsh_aliases_file.stat.exists
