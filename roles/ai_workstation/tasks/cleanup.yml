---
- name: Remove orphaned code/.agents/skills directory
  ansible.builtin.file:
    path: "{{ ai_workstation_user_home }}/code/.agents/skills"
    state: absent

- name: Clean up inline ANTHROPIC exports from ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.bashrc"
    regexp: '^export ANTHROPIC_'
    state: absent

- name: Clean up inline ANTHROPIC exports from ~/.zshrc
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.zshrc"
    regexp: '^export ANTHROPIC_'
    state: absent

- name: Purge legacy custom gateway and model overrides from ~/.claude/settings.json
  ansible.builtin.shell: |
    python3 -c '
    import json, os
    p = os.path.expanduser("{{ ai_workstation_user_home }}/.claude/settings.json")
    if os.path.exists(p):
        try:
            with open(p, "r") as f:
                d = json.load(f)
            changed = False
            for k in ["env", "modelOverrides", "autoCompactWindow"]:
                if k in d:
                    del d[k]
                    changed = True
            if d.get("model") in ["qwen3.7-plus", "qwen3.8-max", "qwen3.8-flash", "deepseek-v4-pro", "glm-5.2"]:
                del d["model"]
                changed = True
            if changed:
                with open(p, "w") as f:
                    json.dump(d, f, indent=2)
                print("Sanitized ~/.claude/settings.json")
        except Exception as e:
            print("Error sanitizing settings.json:", e)
    '
  args:
    executable: /bin/bash
  register: sanitize_claude_settings
  changed_when: "'Sanitized' in sanitize_claude_settings.stdout"

- name: Clean up inline ANTHROPIC and CLAUDE_CODE exports from ~/.profile
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.profile"
    regexp: '^export (ANTHROPIC_|CLAUDE_CODE_)'
    state: absent

- name: Check if ~/.config/zsh/env exists
  ansible.builtin.stat:
    path: "{{ ai_workstation_user_home }}/.config/zsh/env"
  register: ai_workstation_zsh_env_file

- name: Clean up inline ANTHROPIC and CLAUDE_CODE exports from ~/.config/zsh/env
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_user_home }}/.config/zsh/env"
    regexp: '^export (ANTHROPIC_|CLAUDE_CODE_)'
    state: absent
  when: ai_workstation_zsh_env_file.stat.exists

- name: Purge old Claude backup and doctor files
  ansible.builtin.shell: |
    find "{{ ai_workstation_user_home }}/.claude/backups" -type f -name ".claude.json.backup.*" -mtime +7 -delete 2>/dev/null || true
    rm -f "{{ ai_workstation_user_home }}/.claude/settings.json.bak"* "{{ ai_workstation_user_home }}/.claude.json.bak"* 2>/dev/null || true
  args:
    executable: /bin/bash


