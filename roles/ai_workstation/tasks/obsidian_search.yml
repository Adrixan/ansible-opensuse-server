---
# Obsidian Hybrid Search (one loopback MCP server per vault) was dropped by Peter in cleanup round 3
# (2026-11-18: no MCP calls in 60 days; agents read and search the vault files directly). This removes the
# user services, their units and the per-machine indexes; the Node prefix and wrapper go with
# ai_workstation_retired_node_servers (tasks/retired.yml).

- name: Stop and disable the retired Obsidian Hybrid Search user services
  ansible.builtin.systemd_service:
    name: "obsidian-hybrid-search-{{ item.name }}.service"
    scope: user
    enabled: false
    state: stopped
  loop: "{{ ai_workstation_ohs_retired_vaults }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ai_workstation_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ai_workstation_user_uid }}/bus"
  register: ai_workstation_ohs_stop
  # A unit that no longer exists is the goal state
  failed_when: ai_workstation_ohs_stop.failed and 'Could not find the requested service' not in (ai_workstation_ohs_stop.msg | default(''))
  when: not ansible_check_mode

- name: Remove the retired Obsidian Hybrid Search units and indexes
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ ai_workstation_ohs_retired_vaults | map(attribute='name')
         | map('regex_replace', '^(.*)$', ai_workstation_user_home + '/.config/systemd/user/obsidian-hybrid-search-\1.service') | list
       + ai_workstation_ohs_retired_vaults | map(attribute='path') | product(['', '-shm', '-wal'])
         | map('join', '/.obsidian-hybrid-search.db') | list }}
  register: ai_workstation_ohs_removed

- name: Reload the user systemd manager after removing the units
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ai_workstation_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ai_workstation_user_uid }}/bus"
  when: ai_workstation_ohs_removed.changed and not ansible_check_mode

- name: Drop the Syncthing ignore line of the retired index
  ansible.builtin.lineinfile:
    path: "{{ ai_workstation_ohs_syncthing_root }}/.stignore"
    line: "(?d).obsidian-hybrid-search.db*"
    state: absent
