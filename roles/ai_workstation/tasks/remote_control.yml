---
- name: Enable lingering so user services run without a login session
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ ai_workstation_user }}"]
    creates: "/var/lib/systemd/linger/{{ ai_workstation_user }}"
  when: ai_workstation_linger | bool

# tasks for configuring remote control across AI harnesses

- name: Ensure ~/.claude directory exists
  ansible.builtin.file:
    path: "{{ ai_workstation_user_home }}/.claude"
    state: directory
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0755'


- name: Configure remoteControlAtStartup in ~/.claude/settings.json
  ansible.builtin.shell: |
    python3 -c '
    import json, os
    p = os.path.expanduser("{{ ai_workstation_user_home }}/.claude/settings.json")
    target_val = {{ "True" if (ai_workstation_claude_remote_control | default(true) | bool) else "False" }}
    data = {}
    if os.path.exists(p):
        try:
            with open(p, "r") as f:
                data = json.load(f)
        except Exception:
            data = {}
    if data.get("remoteControlAtStartup") != target_val:
        data["remoteControlAtStartup"] = target_val
        with open(p, "w") as f:
            json.dump(data, f, indent=2)
        print("CONFIGURED")
    else:
        print("ALREADY_SET")
    '
  args:
    executable: /bin/bash
  register: claude_remote_control_result
  changed_when: "'CONFIGURED' in claude_remote_control_result.stdout"

- name: Ensure user systemd directory exists
  ansible.builtin.file:
    path: "{{ ai_workstation_user_home }}/.config/systemd/user"
    state: directory
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0755'

- name: Check status of Antigravity CLI remote-control daemon
  ansible.builtin.command:
    cmd: "systemctl --user is-active antigravity-cli-daemon.service"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid | default('1000') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_user_uid | default('1000') }}/bus"
  register: agy_daemon_status
  failed_when: false
  changed_when: false

- name: Start and enable Antigravity CLI remote-control daemon
  ansible.builtin.command:
    cmd: "{{ ai_workstation_user_home }}/.local/bin/agy remote-control start"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid | default('1000') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_user_uid | default('1000') }}/bus"
  when:
    - ai_workstation_antigravity_remote_control | default(true) | bool
    - agy_daemon_status.rc != 0

- name: Read OpenCode background server listen settings
  ansible.builtin.command:
    argv: ["{{ ai_workstation_opencode_bin }}", service, get, "{{ item.key }}"]
  become: true
  become_user: "{{ ai_workstation_user }}"
  loop: "{{ ai_workstation_opencode_service_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: ai_workstation_opencode_service_get
  changed_when: false
  failed_when: false
  check_mode: false
  when: ai_workstation_opencode_remote_control | default(true) | bool

- name: Set OpenCode background server listen settings (stops the server until its next start)
  ansible.builtin.command:
    argv: ["{{ ai_workstation_opencode_bin }}", service, set, "{{ item.item.key }}", "{{ item.item.value | string }}"]
  become: true
  become_user: "{{ ai_workstation_user }}"
  loop: "{{ ai_workstation_opencode_service_get.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key | default('') }}"
  register: ai_workstation_opencode_service_set
  when:
    - ai_workstation_opencode_remote_control | default(true) | bool
    # A missing or V1 binary has no `service` subcommand; the ai_desktop role installs V2
    - item.rc is defined and item.rc == 0
    - item.stdout | trim != item.item.value | string

- name: Deploy OpenCode server user systemd unit
  ansible.builtin.template:
    src: opencode-server.service.j2
    dest: "{{ ai_workstation_user_home }}/.config/systemd/user/opencode-server.service"
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0644'
  register: opencode_service_template
  when: ai_workstation_opencode_remote_control | default(true) | bool

- name: Reload user systemd daemon for OpenCode server
  ansible.builtin.command:
    cmd: "systemctl --user daemon-reload"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid | default('1000') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_user_uid | default('1000') }}/bus"
  when:
    - ai_workstation_opencode_remote_control | default(true) | bool
    - opencode_service_template.changed

- name: Check status of OpenCode server user service
  ansible.builtin.command:
    cmd: "systemctl --user is-active opencode-server.service"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid | default('1000') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_user_uid | default('1000') }}/bus"
  register: opencode_service_status
  failed_when: false
  changed_when: false
  when: ai_workstation_opencode_remote_control | default(true) | bool

- name: Ensure OpenCode server user service is enabled and started
  ansible.builtin.command:
    cmd: "systemctl --user enable --now opencode-server.service"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid | default('1000') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_user_uid | default('1000') }}/bus"
  when:
    - ai_workstation_opencode_remote_control | default(true) | bool
    - opencode_service_status.rc is defined and opencode_service_status.rc != 0

- name: Restart running OpenCode server to load a changed unit or rendered config
  ansible.builtin.command:
    cmd: "systemctl --user restart opencode-server.service"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid | default('1000') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_user_uid | default('1000') }}/bus"
  when:
    - ai_workstation_opencode_remote_control | default(true) | bool
    - opencode_service_status.rc is defined and opencode_service_status.rc == 0
    - >-
      opencode_service_template.changed or (ai_workstation_yadm_alt.changed | default(false))
      or (ai_workstation_opencode_service_set.changed | default(false))

- name: Ensure Claude remote-control server config directory exists
  ansible.builtin.file:
    path: "{{ ai_workstation_user_home }}/.config/claude-rc"
    state: directory
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0755'
  when: ai_workstation_claude_remote_control | default(true) | bool

- name: Deploy Claude remote-control server template unit
  ansible.builtin.template:
    src: claude-remote-control@.service.j2
    dest: "{{ ai_workstation_user_home }}/.config/systemd/user/claude-remote-control@.service"
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0644'
  register: claude_rc_unit
  when: ai_workstation_claude_remote_control | default(true) | bool

- name: Deploy per-directory Claude remote-control server settings
  ansible.builtin.copy:
    dest: "{{ ai_workstation_user_home }}/.config/claude-rc/{{ item.name }}.conf"
    content: |
      # Managed by Ansible (ai_workstation role, remote_control.yml)
      RC_DIR="{{ item.dir }}"
      RC_NAME="{{ item.label }}"
      RC_ARGS="{{ item.args | default('') }}"
      RC_AUTOSTART="{{ 'yes' if item.autostart | default(false) else 'no' }}"
      RC_DESCRIPTION="{{ item.description | default('') }}"
    owner: "{{ ai_workstation_user }}"
    group: "{{ ai_workstation_user }}"
    mode: '0644'
  loop: "{{ ai_workstation_claude_rc_servers }}"
  loop_control:
    label: "{{ item.name }}"
  register: claude_rc_conf
  when: ai_workstation_claude_remote_control | default(true) | bool

- name: Reload user systemd daemon for Claude remote-control servers
  ansible.builtin.command:
    cmd: "systemctl --user daemon-reload"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid | default('1000') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_user_uid | default('1000') }}/bus"
  when:
    - ai_workstation_claude_remote_control | default(true) | bool
    - claude_rc_unit.changed or claude_rc_conf.changed

- name: Read Claude Code state for remote-control consent and workspace trust
  ansible.builtin.slurp:
    src: "{{ ai_workstation_user_home }}/.claude.json"
  register: claude_state_raw
  failed_when: false
  when: ai_workstation_claude_remote_control | default(true) | bool

- name: Determine which Claude remote-control servers can start unattended
  ansible.builtin.set_fact:
    claude_rc_ready: "{{ claude_rc_ready | default([]) + ([item.name] if (claude_state.remoteDialogSeen | default(false) and (claude_state.projects[item.dir].hasTrustDialogAccepted | default(false))) else []) }}"
  vars:
    claude_state: "{{ (claude_state_raw.content | default('e30=') | b64decode | from_json) }}"
  loop: "{{ ai_workstation_claude_rc_servers }}"
  loop_control:
    label: "{{ item.name }}"
  when: ai_workstation_claude_remote_control | default(true) | bool

# Roles started on request are checked by `rc up`, which also accepts trust inherited from a parent folder
- name: Warn about autostart Claude remote-control servers that need interactive consent or trust
  ansible.builtin.debug:
    msg: >-
      Skipping claude-remote-control@{{ item.name }}: run `cd {{ item.dir }} && claude remote-control`
      once in a terminal, answer the trust and "Enable Remote Control?" prompts with y, press Ctrl+C,
      then rerun the playbook.
  loop: "{{ ai_workstation_claude_rc_servers }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - ai_workstation_claude_remote_control | default(true) | bool
    - item.autostart | default(false)
    - item.name not in (claude_rc_ready | default([]))

- name: Check boot state of Claude remote-control servers
  ansible.builtin.command:
    cmd: "systemctl --user is-enabled claude-remote-control@{{ item.name }}.service"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid | default('1000') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_user_uid | default('1000') }}/bus"
  loop: "{{ ai_workstation_claude_rc_servers }}"
  loop_control:
    label: "{{ item.name }}"
  register: claude_rc_enabled
  failed_when: false
  changed_when: false
  when: ai_workstation_claude_remote_control | default(true) | bool

# Only autostart roles (greeter, teaching, research) come up at boot; the others start on request with `rc up <role>`
- name: Enable and start the autostart Claude remote-control servers
  ansible.builtin.command:
    cmd: "systemctl --user enable --now claude-remote-control@{{ item.item.name }}.service"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid | default('1000') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_user_uid | default('1000') }}/bus"
  loop: "{{ claude_rc_enabled.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - ai_workstation_claude_remote_control | default(true) | bool
    - item.item.autostart | default(false)
    - item.item.name in (claude_rc_ready | default([]))
    - item.rc != 0

# Disable only: a running server keeps serving its sessions until `rc down`
- name: Remove the other Claude remote-control servers from boot
  ansible.builtin.command:
    cmd: "systemctl --user disable claude-remote-control@{{ item.item.name }}.service"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid | default('1000') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_user_uid | default('1000') }}/bus"
  loop: "{{ claude_rc_enabled.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - ai_workstation_claude_remote_control | default(true) | bool
    - not (item.item.autostart | default(false))
    - item.rc == 0

- name: Check which Claude remote-control servers are running
  ansible.builtin.command:
    cmd: "systemctl --user is-active claude-remote-control@{{ item.name }}.service"
  become: true
  become_user: "{{ ai_workstation_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ target_user_uid | default('1000') }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ target_user_uid | default('1000') }}/bus"
  loop: "{{ ai_workstation_claude_rc_servers }}"
  loop_control:
    label: "{{ item.name }}"
  register: claude_rc_active
  failed_when: false
  changed_when: false
  when: ai_workstation_claude_remote_control | default(true) | bool

# No automatic restart: it ends every session the server holds, including the one running this playbook
- name: Report running Claude remote-control servers that need a restart for new settings
  ansible.builtin.debug:
    msg: "Running with old settings (apply with `rc restart <role>` when no session needs them): {{ _stale | join(', ') }}"
  vars:
    _changed: "{{ claude_rc_conf.results | default([]) | selectattr('changed', 'defined') | selectattr('changed') | map(attribute='item.name') | list }}"
    _running: "{{ claude_rc_active.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | map(attribute='item.name') | list }}"
    _stale: "{{ (_running if claude_rc_unit.changed else (_running | intersect(_changed))) }}"
  when:
    - ai_workstation_claude_remote_control | default(true) | bool
    - _stale | length > 0
