---
# defaults file for ai_workstation
ai_workstation_user: "{{ target_user | default('Adrixan') }}"
ai_workstation_user_home: "{{ target_user_home | default('/home/' + ai_workstation_user) }}"

ai_workstation_packages:
  - nodejs
  - npm
  - git
  - sqlite3
  - python313-uv
  # Browser for the Playwright MCP server (zypper-managed, so it receives security updates)
  - chromium
  # Go 1.27+ compiler for building the local TLS 1.3 ECH reverse proxy (dragtokens-ech-proxy)
  - go
  # OSV dependency scanner; `osv-scanner experimental-mcp` is the OSV MCP server (stdio)
  - osv-scanner
  # node-gyp toolchain for native modules of the Node.js MCP servers (Grounded Docs)
  - gcc-c++
  - make

ai_workstation_github_token: "{{ lookup('env', 'GITHUB_PERSONAL_ACCESS_TOKEN') | default(lookup('env', 'GITHUB_TOKEN') | default('', true), true) }}"
ai_workstation_anthropic_api_key: "{{ lookup('env', 'ANTHROPIC_API_KEY') | default('', true) }}"
ai_workstation_anthropic_workspace_id: "{{ lookup('env', 'ANTHROPIC_WORKSPACE_ID') | default('', true) }}"
# Nextcloud MCP server credentials (use an app password from Settings > Security > Devices & sessions)
ai_workstation_nextcloud_host: "{{ lookup('env', 'NEXTCLOUD_HOST') | default('', true) }}"
ai_workstation_nextcloud_username: "{{ lookup('env', 'NEXTCLOUD_USERNAME') | default('', true) }}"
ai_workstation_nextcloud_password: "{{ lookup('env', 'NEXTCLOUD_PASSWORD') | default('', true) }}"
# DragTokens OpenAI-compatible gateway for OpenCode (key bound to a codex-pro or enterprise pool group)
ai_workstation_dragtokens_api_key: "{{ lookup('env', 'DRAGTOKENS_API_KEY') | default('', true) }}"
ai_workstation_dragtokens_ech_proxy: true
ai_workstation_dragtokens_ech_proxy_host: "127.0.0.1"
ai_workstation_dragtokens_ech_proxy_port: 4097

# MCP server runtimes. Harness configs are owned by yadm:
#   ~/.config/ai/claude-plugins (Claude Code plugin), ~/.gemini/config/mcp_config.json##template,
#   ~/.config/opencode/opencode.json##template
ai_workstation_user_uid: "{{ target_user_uid | default(1000) }}"
ai_workstation_mcp_npm_packages:
  - "@playwright/mcp"
  - "@modelcontextprotocol/server-memory"
ai_workstation_mcp_npm_state: latest
ai_workstation_mcp_uv_tools:
  - { name: serena-agent, python: "3.13" }
  - { name: markitdown-mcp }
  - { name: nextcloud-mcp-server }
  - { name: mcp-server-docker }
  - { name: arxiv-mcp-server }
  - { name: zotero-mcp-server }
  - { name: mcp-server-fetch }
  - { name: mcp-server-git }
  - { name: package-version-check-mcp }
  # semgrep pins mcp==1.29.0 (CVE-2026-59951); the override takes the newest 1.x (1.30.0 has the fix,
  # 2.x renamed FastMCP and breaks it)
  - { name: semgrep, overrides: ["mcp<2"] }
  - { name: wikipedia-mcp }
  # openroute-mcp leaves mcp unpinned and breaks on mcp 2.x (FastMCP renamed)
  - { name: openroute-mcp, overrides: ["mcp<2"] }
  # Key-less web search; installed without the [browser] extra, so no curl TLS impersonation
  - { name: duckduckgo-mcp-server }
  - { name: oebb-mcp-server }
  # Oracle's recommended OCI server: every OCI API through the SDK, limited only by the profile's IAM.
  # Needs Python 3.13. It locks fastmcp and oci caps cryptography at versions with known advisories, so
  # the overrides take the fixed releases (fastmcp stays on 3.x); request signing tested with them.
  - name: oracle.oci-cloud-mcp-server
    python: "3.13"
    overrides: ["fastmcp>=3.4.10,<4", "cryptography>=50"]
  # OCI CLI for `oci session authenticate` (openSUSE ships an older release); its pins carry advisories
  - name: oci-cli
    python: "3.13"
    overrides: ["certifi>=2026.10.18", "setuptools>=84.1.0"]
  # stdio-to-HTTP bridge behind the shared MCP services (tasks/mcp_shared.yml)
  - { name: mcp-proxy }
  # PyPI stops at 0.3.5; releases continue on GitHub, so the tool follows the latest GitHub release tag
  - name: mcp-youtube-transcript
    github_release: jkawamoto/mcp-youtube-transcript
  # Taxuspt/garmin_mcp: the only release (0.1.0) predates the tool filter and PyPI's garmin-mcp is an
  # unrelated project, so this installs a reviewed commit. Commit pin because the server holds a token
  # for the whole Garmin account and git sources bypass the 24 h cooldown; to bump it, review the new
  # commit, change it here and run `uv tool install --force` with the same arguments. Upstream pins
  # garminconnect==0.3.2 (GHSA-wjhr-76vg-2hvc, world-readable token store, fixed in 0.3.5).
  - name: garmin-mcp
    python: "3.13"
    source: git+https://github.com/Taxuspt/garmin_mcp@a2ca5fcac34524b83814fe2fcf3d479f8a75983f
    overrides: ["garminconnect>=0.3.20", "requests>=2.34.2", "python-dotenv>=1.2.4"]
ai_workstation_mcp_uv_overrides_dir: "{{ ai_workstation_user_home }}/.config/ai/uv-overrides"
# Node.js MCP servers, one npm prefix each under ai_workstation_mcp_node_dir, always on the latest
# release: every run updates the whole tree (`npm update`). `overrides` force vulnerable transitive
# dependencies to their latest release where the server's own ranges keep an affected one (npm audit
# gates the role), `allow_scripts` is the npm install-script allowlist by package name (unset: no
# install scripts run), `env` is exported by the wrapper, `spec` replaces `latest` in the manifest.
ai_workstation_mcp_node_dir: /opt/mcp
ai_workstation_mcp_node_servers:
  # Cloudflare CLI (agent setup, 2026-10-30), only published as a beta. Below Node 26.12 `latest`
  # resolves to beta.19 with known advisories, so the minimum keeps the first audited release; drop
  # the spec once every machine runs Node 26.12 (zypper dup).
  - name: cf
    package: cf
    bin: cf
    spec: ">=1.0.0-beta.25"
  # Google Cloud: all of gcloud, limited only by the active account's IAM, plus logs, metrics and traces
  # Both ship a self-contained dist/bundle.js with their own zod 3 (GHSA for zod <4.6.6, no fixed release
  # upstream). The overrides satisfy npm audit but do not change the bundled copy: remove them once
  # Google rebuilds. Input only comes from local agents over loopback; Peter accepted this on 2026-10-31.
  - name: gcloud
    package: "@google-cloud/gcloud-mcp"
    bin: gcloud-mcp
    overrides: { zod: latest }
  - name: gcloud-observability
    package: "@google-cloud/observability-mcp"
    bin: observability-mcp
    overrides: { zod: latest, minimatch: latest, glob: latest, rimraf: latest }
  - name: openalex
    package: "@cyanheads/openalex-mcp-server"
    bin: openalex-mcp-server
  - name: excalidraw
    package: mcp-excalidraw-server
    bin: mcp-excalidraw-server
    # The auto-started canvas server binds $HOST:$PORT; zsh exports HOST as the machine name
    env:
      HOST: 127.0.0.1
      PORT: "{{ ai_workstation_excalidraw_port }}"
      EXPRESS_SERVER_URL: "http://127.0.0.1:{{ ai_workstation_excalidraw_port }}"
    # Its latest release still ranges onto affected zod 3, mermaid 10, dompurify, katex, lodash-es,
    # nanoid, uuid and the chevrotain/langium parser chain; tool schemas and calls verified on zod 4
    overrides:
      "@modelcontextprotocol/core": latest
      "@modelcontextprotocol/server": latest
      chevrotain: latest
      dompurify: latest
      katex: latest
      langium: latest
      lodash-es: latest
      mermaid: latest
      nanoid: latest
      sass: latest
      uuid: latest
      zod: latest
  - name: drawio
    package: "@drawio/mcp"
    bin: drawio-mcp
  - name: obsidian-hybrid-search
    package: obsidian-hybrid-search
    bin: obsidian-hybrid-search
    # onnxruntime-node ships its CPU runtime; its postinstall only downloads ~270 MB of CUDA providers
    allow_scripts:
      better-sqlite3: true
      onnxruntime-node: false
      protobufjs: false
  - name: lighthouse
    package: "@danielsogl/lighthouse-mcp"
    bin: lighthouse-mcp-server
    overrides: { glob: latest, minimatch: latest }    # GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249
    env:
      CHROME_PATH: "{{ ai_workstation_mcp_chromium }}"
  - name: accessibility-scanner
    package: accessibility-scanner-mcp
    bin: accessibility-scanner-mcp
    env:
      CHROME_PATH: "{{ ai_workstation_mcp_chromium }}"
  - name: docs
    package: "@arabold/docs-mcp-server"
    bin: docs-mcp-server
    overrides: { glob: latest, minimatch: latest }    # GHSA-3g3m-2fjr-6pw4, GHSA-g3hv-75wg-m249
    env:
      DOCS_MCP_TELEMETRY: "false"
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: "{{ ai_workstation_mcp_chromium }}"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    # Native modules compile with node-gyp (gcc-c++, make); the package's own postinstall only echoes
    allow_scripts:
      better-sqlite3: true
      tree-sitter: true
      tree-sitter-javascript: true
      tree-sitter-python: true
      tree-sitter-typescript: true
      "@arabold/docs-mcp-server": false
  - name: nasa
    package: "@programcomputer/nasa-mcp-server"
    bin: nasa-mcp-server
  - name: open-meteo
    package: open-meteo-mcp-server
    bin: open-meteo-mcp-server
  - name: ris-austria
    package: "@cyanheads/ris-austria-mcp-server"
    bin: ris-austria-mcp-server
  - name: eur-lex
    package: "@cyanheads/eur-lex-mcp-server"
    bin: eur-lex-mcp-server
ai_workstation_excalidraw_port: 3031
# Thunderbird MCP from its latest GitHub release: the Node bridge (no dependencies) from the release
# tag, the add-on (.xpi, verified against the release digest) next to it for a manual install in
# Thunderbird
ai_workstation_thunderbird_mcp: true
ai_workstation_thunderbird_mcp_repo: TKasperczyk/thunderbird-mcp
ai_workstation_thunderbird_mcp_dir: "{{ ai_workstation_mcp_node_dir }}/thunderbird-mcp"
ai_workstation_thunderbird_mcp_files: [mcp-bridge.cjs, package.json]
# Lighthouse, the accessibility scanner and Playwright hard-code --no-sandbox; this wrapper drops it
ai_workstation_mcp_chromium: /usr/local/libexec/mcp-chromium-sandboxed
# Grounded Docs: version-matched documentation index, one loopback HTTP server for all sessions
ai_workstation_docs_mcp: true
ai_workstation_docs_mcp_port: 6280
ai_workstation_docs_mcp_store: "{{ ai_workstation_user_home }}/.local/share/docs-mcp-server"
# GPX routes from the openroute MCP server (Documents is a Syncthing folder, so they reach the phone)
ai_workstation_openroute_routes_dir: "{{ ai_workstation_user_home }}/Documents/Routes"
# Free API keys (api.nasa.gov, openrouteservice.org); NASA falls back to the public DEMO_KEY
ai_workstation_nasa_api_key: "{{ lookup('env', 'NASA_API_KEY') | default('', true) }}"
ai_workstation_openroute_api_key: "{{ lookup('env', 'OPENROUTESERVICE_API_KEY') | default('', true) }}"
# Phở Research Tools (reference verification, retractions, PRISMA 2020) served on loopback only.
# Upstream ships no package or releases; the role follows the default branch, updates the dependency
# tree to the latest versions its ranges allow and audits it.
ai_workstation_pho: true
ai_workstation_pho_repo: https://github.com/thaohienhomes/pho-research-tools.git
ai_workstation_pho_version: HEAD
ai_workstation_pho_pnpm: "pnpm@latest"
# Its MCP SDK 1.x and its own code range onto affected zod 3 (GHSA-mrhx-c7xc-m3w5); tools verified on zod 4
# and onto affected @hono/node-server (GHSA-rmxm-3fg6-px4f)
ai_workstation_pho_overrides:
  zod: latest
  "@hono/node-server": latest
ai_workstation_pho_dir: "{{ ai_workstation_user_home }}/.local/share/pho-research-tools"
ai_workstation_pho_port: 8787
# Obsidian Hybrid Search HTTP servers (one per vault, loopback; about 700 MB RSS each with the
# local embedding and reranker models). The index lives in the vault and is excluded from Syncthing.
ai_workstation_ohs_vaults:
  - name: phd
    path: "{{ ai_workstation_user_home }}/Obsidian/Ph.D."
    port: 3939
  - name: adrixan
    path: "{{ ai_workstation_user_home }}/Obsidian/Adrixan"
    port: 3940
    # schulpc (7.5 GB RAM, many concurrent agent sessions) ran out of memory with this index
    skip_hosts: [schulpc]
ai_workstation_ohs_syncthing_root: "{{ ai_workstation_user_home }}/Obsidian"
# Shared MCP services: the stdio servers without per-session state run once behind one loopback
# mcp-proxy, and every harness session connects over HTTP instead of starting its own copy (about
# 1.9 GB per Claude Code session before). URL: http://127.0.0.1:<port>/servers/<name>/mcp.
# Servers that hold per-session state or resolve paths against the session's working directory
# (playwright, serena, git, osv, semgrep) stay stdio in the harness configs.
# newspaper-testground stays stdio too: locally it is only an ssh client, and a network drop would
# make it exit, which stops every shared server.
# mcp-proxy stops every server when one exits, so the launcher skips an entry whose command is not
# installed, whose `requires_env` variable is empty or whose `requires_path` is missing.
# `default_env` applies only where ~/.config/ai/env leaves the variable unset.
ai_workstation_mcp_shared: true
ai_workstation_mcp_shared_port: 8790
ai_workstation_mcp_shared_dir: "{{ ai_workstation_user_home }}/.config/mcp-shared"
ai_workstation_mcp_shared_launcher: /usr/local/libexec/mcp-shared-proxy.py
ai_workstation_mcp_shared_python: "{{ ai_workstation_user_home }}/.local/share/uv/tools/mcp-proxy/bin/python"
# Garmin Connect: raw activity files (location history, health data) stay outside Syncthing and the
# cloud backups. Allowlist of read-only tools, the two local file downloads and one write tool:
# upload_course (Peter, 2026-10-30) creates a private course from a .gpx on this machine, each upload
# needs Peter's go in the session. Nothing can be changed or deleted on Garmin Connect, delete_course
# stays off; a new upstream tool stays off until it is listed here.
ai_workstation_garmin_data_dir: "{{ ai_workstation_user_home }}/.local/share/garmin-mcp/activities"
ai_workstation_garmin_tools: [
  count_activities, download_activity_file, download_course_gpx, get_acclimation, get_activities,
  get_activities_by_date, get_activities_fordate, get_activity, get_activity_exercise_sets,
  get_activity_fit_data, get_activity_fit_messages, get_activity_gear,
  get_activity_hr_in_timezones, get_activity_power_in_timezones, get_activity_split_summaries,
  get_activity_splits, get_activity_typed_splits, get_activity_types, get_activity_weather,
  get_adhoc_challenges, get_all_day_events, get_all_day_stress, get_available_badge_challenges,
  get_badge_challenges, get_blood_pressure, get_body_battery, get_body_battery_events,
  get_body_composition, get_calendar_events, get_course_details, get_courses, get_cycling_ftp,
  get_daily_steps, get_daily_weigh_ins, get_device_last_used, get_device_settings,
  get_device_solar_data, get_devices, get_earned_badges, get_endurance_score, get_energy_balance,
  get_fitnessage_data, get_floors, get_full_name, get_garmin_coach_workouts, get_gear, get_goals,
  get_heart_rate_zones, get_heart_rates, get_heart_rates_summary, get_hill_score, get_hrv_data,
  get_hrv_trend, get_hydration_data, get_inprogress_virtual_challenges, get_lactate_threshold,
  get_lifestyle_logging_data, get_morning_training_readiness, get_non_completed_badge_challenges,
  get_personal_record, get_power_duration_curve, get_primary_training_device,
  get_progress_summary_between_dates, get_race_predictions, get_recovery_time_remaining,
  get_respiration_data, get_respiration_summary, get_respiration_trend, get_rhr_day,
  get_running_tolerance, get_running_tolerance_trend, get_scheduled_workouts, get_sleep_data,
  get_sleep_summary, get_sleep_summary_range, get_spo2_data, get_stats, get_stats_and_body,
  get_stats_range, get_steps_data, get_stress_data, get_stress_summary, get_training_effect,
  get_training_load_balance, get_training_load_trend, get_training_plan_workouts,
  get_training_readiness, get_training_status, get_unit_system, get_user_profile,
  get_user_summary, get_userprofile_settings, get_vo2max_trend, get_weekly_intensity_minutes,
  get_weekly_steps, get_weekly_stress, get_weigh_ins, get_workout_by_id, get_workouts, upload_course
]
ai_workstation_mcp_shared_servers:
  - name: memory
    command: /usr/local/bin/mcp-server-memory
    env: { MEMORY_FILE_PATH: "{{ ai_workstation_mcp_memory_dir }}/mcp-memory.jsonl" }
  - { name: fetch, command: "{{ ai_workstation_user_home }}/.local/bin/mcp-server-fetch" }
  - { name: markitdown, command: "{{ ai_workstation_user_home }}/.local/bin/markitdown-mcp" }
  - name: arxiv
    command: "{{ ai_workstation_user_home }}/.local/bin/arxiv-mcp-server"
    args: ["--storage-path", "{{ ai_workstation_user_home }}/Obsidian/Ph.D./Papers/arxiv"]
  - name: zotero
    command: "{{ ai_workstation_user_home }}/.local/bin/zotero-mcp"
    env: { ZOTERO_LOCAL: "true" }
  - name: nextcloud
    command: "{{ ai_workstation_user_home }}/.local/bin/nextcloud-mcp-server"
    args: ["run", "--transport", "stdio"]
    requires_env: [NEXTCLOUD_HOST, NEXTCLOUD_USERNAME, NEXTCLOUD_PASSWORD]
  - name: docker
    command: "{{ ai_workstation_user_home }}/.local/bin/mcp-server-docker"
    env: { DOCKER_HOST: "tcp://127.0.0.1:{{ ai_workstation_docker_mcp_proxy_port }}" }
    requires_path: [/run/docker.sock]
  - name: package-versions
    command: "{{ ai_workstation_user_home }}/.local/bin/package-version-check-mcp"
    args: ["--mode=stdio"]
  - name: openalex
    command: /usr/local/bin/openalex-mcp-server
    env: { MCP_TRANSPORT_TYPE: stdio, MCP_LOG_LEVEL: error }
  - { name: excalidraw, command: /usr/local/bin/mcp-excalidraw-server }
  - { name: drawio, command: /usr/local/bin/drawio-mcp }
  - { name: lighthouse, command: /usr/local/bin/lighthouse-mcp-server }
  - { name: accessibility, command: /usr/local/bin/accessibility-scanner-mcp }
  # Without a key from ~/.config/ai/env the server uses the public DEMO_KEY
  - name: nasa
    command: /usr/local/bin/nasa-mcp-server
    default_env: { NASA_API_KEY: DEMO_KEY }
  - { name: open-meteo, command: /usr/local/bin/open-meteo-mcp-server }
  - name: openroute
    command: "{{ ai_workstation_user_home }}/.local/bin/openroute-mcp"
    args: ["--data-folder", "{{ ai_workstation_openroute_routes_dir }}"]
    requires_env: [OPENROUTESERVICE_API_KEY]
  - name: wikipedia
    command: "{{ ai_workstation_user_home }}/.local/bin/wikipedia-mcp"
    args: ["--language", "en"]
  - name: duckduckgo
    command: "{{ ai_workstation_user_home }}/.local/bin/duckduckgo-mcp-server"
    env: { DDG_SAFE_SEARCH: MODERATE }
  - { name: ris-austria, command: /usr/local/bin/ris-austria-mcp-server }
  - { name: eur-lex, command: /usr/local/bin/eur-lex-mcp-server }
  - { name: youtube-transcript, command: "{{ ai_workstation_user_home }}/.local/bin/mcp-youtube-transcript" }
  - { name: oebb, command: "{{ ai_workstation_user_home }}/.local/bin/oebb-mcp-server" }
  - { name: thunderbird, command: /usr/local/bin/thunderbird-mcp }
  # trip-scout and trip-planner are installed by hand (uv tool install from ~/code); skipped where absent
  - name: trip-scout
    command: "{{ ai_workstation_user_home }}/.local/bin/trip-scout"
    args: [mcp]
  - name: trip-planner
    command: "{{ ai_workstation_user_home }}/.local/bin/trip-planner"
    args: [mcp]
    requires_env: [TRIP_PLANNER_TOKEN]
  # Skipped until `garmin-mcp-auth` has stored the tokens (interactive: password and MFA code)
  - name: garmin
    command: "{{ ai_workstation_user_home }}/.local/bin/garmin-mcp"
    requires_path: ["{{ ai_workstation_user_home }}/.garminconnect/garmin_tokens.json"]
    env:
      GARMIN_ENABLED_TOOLS: "{{ ai_workstation_garmin_tools | join(',') }}"
      GARMIN_FIT_DOWNLOAD_DIR: "{{ ai_workstation_garmin_data_dir }}"
  # Own projects, installed by hand (PTSD from ~/code/PTSD, File Accountant as uv tool); both hold
  # confidential data (minors' submissions, client books) and keep their confirm tokens server-side
  - name: ptsd
    command: /usr/bin/node
    args: ["{{ ai_workstation_user_home }}/code/PTSD/mcp/dist/server.mjs"]
    requires_path: ["{{ ai_workstation_user_home }}/code/PTSD/mcp/dist/server.mjs"]
  - name: file-accountant
    command: "{{ ai_workstation_user_home }}/.local/bin/fa"
    args: [mcp]
    requires_path: ["{{ ai_workstation_user_home }}/.config/file-accountant/config.json"]
  # The cloud servers start only once the read-only keys exist and use their own credentials, so an
  # admin login on this machine (Peter keeps his) never reaches them: `oci` reads the DEFAULT profile,
  # the gcloud servers a separate CLOUDSDK_CONFIG. Restart mcp-shared after creating the keys.
  - name: oci
    command: "{{ ai_workstation_user_home }}/.local/bin/oracle.oci-cloud-mcp-server"
    requires_path: ["{{ ai_workstation_user_home }}/.oci/claude-readonly.pem"]
    env: { OCI_CONFIG_PROFILE: DEFAULT }
  - name: gcloud
    command: /usr/local/bin/gcloud-mcp
    requires_path: ["{{ ai_workstation_user_home }}/.config/gcloud-readonly/claude-readonly.json"]
    env: { CLOUDSDK_CONFIG: "{{ ai_workstation_user_home }}/.config/gcloud-readonly" }
  - name: gcloud-observability
    command: /usr/local/bin/observability-mcp
    requires_path: ["{{ ai_workstation_user_home }}/.config/gcloud-readonly/claude-readonly.json"]
    env: { GOOGLE_APPLICATION_CREDENTIALS: "{{ ai_workstation_user_home }}/.config/gcloud-readonly/claude-readonly.json" }
# Google Cloud CLI for the gcloud MCP server: upstream tarball (no openSUSE package)
ai_workstation_gcloud_dir: /opt/google-cloud-sdk
ai_workstation_gcloud_url: https://dl.google.com/dl/cloudsdk/channels/rapid/google-cloud-sdk.tar.gz
ai_workstation_gcloud_cooldown_seconds: 86400
ai_workstation_mcp_tools_update_on_calendar: daily
ai_workstation_claude_bin: "{{ ai_workstation_user_home }}/.local/bin/claude"
ai_workstation_claude_marketplace_dir: "{{ ai_workstation_user_home }}/.config/ai/claude-plugins"
# Plugins of that marketplace: workstation-mcp holds the core servers, the others are switched off
# per directory in .claude/settings.json (enabledPlugins) where they are not needed
ai_workstation_claude_plugins_list: [workstation-mcp, workstation-dev, workstation-research, workstation-travel]
# Upstream plugins: OpenCode and Antigravity read the skills from the marketplace clone (yadm templates)
ai_workstation_claude_upstream_plugins:
  - { marketplace: cloudflare, source: cloudflare/skills, plugin: cloudflare }
# Knowledge graph of the memory MCP server, inside the Syncthing "sync" folder
ai_workstation_mcp_memory_dir: "{{ ai_workstation_user_home }}/sync/ai"
# User-scope servers previously written to ~/.claude.json, now provided by the workstation-mcp plugin
ai_workstation_legacy_claude_mcp_servers: [github, puppeteer, sqlite, memory, fetch, git, arxiv, zotero]

# Read-only Docker API for the docker MCP server (deployed only where Docker is installed)
ai_workstation_docker_mcp_proxy: true
# Image tag = latest GitHub release of the proxy (docker-compose@ pulls it at every start)
ai_workstation_docker_mcp_proxy_image: tecnativa/docker-socket-proxy
ai_workstation_docker_mcp_proxy_repo: Tecnativa/docker-socket-proxy
ai_workstation_docker_mcp_proxy_port: 2375

# Keep user services (remote control, update timers) running without a login session
ai_workstation_linger: true

# Remote control configuration across harnesses
ai_workstation_claude_remote_control: true
ai_workstation_antigravity_remote_control: true
ai_workstation_opencode_remote_control: true
# Claude remote-control roles, one server per working directory (sessions started from the Claude app
# run in that directory). Only `autostart` roles start at boot (the greeter); the others start on
# request with `rc up <role>` (yadm ~/.local/bin/rc, skill rc-roles). `args` adds remote-control flags
# (e.g. "--spawn worktree"), `description` is what `rc ls` shows. Custom roles from `rc new` live in
# ~/Obsidian/Adrixan/AI/Roles and are not managed here. Needs the one-time "Enable Remote Control?"
# consent and workspace trust per directory; the role skips autostart servers until both are present.
ai_workstation_claude_rc_servers:
  - name: greeter
    label: "Greeter"
    dir: "{{ ai_workstation_user_home }}/Obsidian/Adrixan/AI/Greeter"
    description: "Starts, stops and creates the other roles (no MCP plugins)"
    autostart: true
  - name: phd
    label: "PhD"
    dir: "{{ ai_workstation_user_home }}/Obsidian/Ph.D."
    description: "Ph.D. vault: scoping review, Zotero, writing"
  - name: teaching
    label: "Teaching"
    dir: "{{ ai_workstation_user_home }}/Obsidian/Adrixan/Teaching"
    description: "Teacher: lessons, Typst material, grading"
    autostart: true
  - name: educator
    label: "Educator"
    dir: "{{ ai_workstation_user_home }}/Obsidian/Adrixan/Educator"
    description: "Educator brand Prof. Aufner: content pipeline"
  # General deep-research jobs; reports land in this vault folder (rules in its AGENTS.md).
  # Starts at boot like teaching (Peter, 2026-10-29); the server reattaches its previous session
  - name: research
    label: "Deep Research"
    dir: "{{ ai_workstation_user_home }}/Obsidian/Adrixan/Research"
    description: "Deep-research reports"
    autostart: true
  # Coding across all projects; sessions cd into ~/code/<project> and follow its AGENTS.md
  - name: code
    label: "Code"
    dir: "{{ ai_workstation_user_home }}/code"
    description: "Coding across ~/code projects"
  - name: travel
    label: "Travel Planner"
    # Not offered by the Greeter: trips run as their own roles (`rc trip <destination>`)
    dir: "{{ ai_workstation_user_home }}/Obsidian/Adrixan/Travel"
    description: "Trip plans with trip-scout and trip-planner"
ai_workstation_claude_rc_permission_mode: auto
ai_workstation_opencode_server_port: 4096
ai_workstation_opencode_server_host: "127.0.0.1"
# Persisted with `opencode service set` (~/.config/opencode/service.json, which also holds the generated server password)
ai_workstation_opencode_service_settings:
  hostname: "{{ ai_workstation_opencode_server_host }}"
  port: "{{ ai_workstation_opencode_server_port }}"
# Native install from the ai_desktop role
ai_workstation_opencode_bin: "{{ ai_workstation_user_home }}/.opencode/bin/opencode"
