---
# defaults file for ai_workstation
ai_workstation_user: "{{ target_user | default('Adrixan') }}"
ai_workstation_user_home: "{{ target_user_home | default('/home/' + ai_workstation_user) }}"

ai_workstation_packages:
  - nodejs
  - npm
  - git
  - sqlite3

ai_workstation_github_token: "{{ lookup('env', 'GITHUB_PERSONAL_ACCESS_TOKEN') | default(lookup('env', 'GITHUB_TOKEN') | default('', true), true) }}"
ai_workstation_anthropic_api_key: "{{ lookup('env', 'ANTHROPIC_API_KEY') | default('', true) }}"
ai_workstation_anthropic_workspace_id: "{{ lookup('env', 'ANTHROPIC_WORKSPACE_ID') | default('', true) }}"
ai_workstation_nowcoding_api_key: "{{ lookup('env', 'NOWCODING_API_KEY') | default('', true) }}"
