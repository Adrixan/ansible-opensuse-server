---
# defaults file for ai_workstation
ai_workstation_user: "{{ target_user | default('Adrixan') }}"
ai_workstation_user_home: "{{ target_user_home | default('/home/' + ai_workstation_user) }}"

ai_workstation_packages:
  - nodejs
  - npm
  - git
  - sqlite3
  - python313-uv
  # Browser for the Playwright MCP server (zypper-managed, so it receives security updates)
  - chromium
  # Go 1.27+ compiler for building the local TLS 1.3 ECH reverse proxy (dragtokens-ech-proxy)
  - go
  # OSV dependency scanner; `osv-scanner experimental-mcp` is the OSV MCP server (stdio)
  - osv-scanner
  # node-gyp toolchain for native modules of the Node.js MCP servers (Grounded Docs)
  - gcc-c++
  - make

ai_workstation_github_token: "{{ lookup('env', 'GITHUB_PERSONAL_ACCESS_TOKEN') | default(lookup('env', 'GITHUB_TOKEN') | default('', true), true) }}"
ai_workstation_anthropic_api_key: "{{ lookup('env', 'ANTHROPIC_API_KEY') | default('', true) }}"
ai_workstation_anthropic_workspace_id: "{{ lookup('env', 'ANTHROPIC_WORKSPACE_ID') | default('', true) }}"
# Nextcloud MCP server credentials (use an app password from Settings > Security > Devices & sessions)
ai_workstation_nextcloud_host: "{{ lookup('env', 'NEXTCLOUD_HOST') | default('', true) }}"
ai_workstation_nextcloud_username: "{{ lookup('env', 'NEXTCLOUD_USERNAME') | default('', true) }}"
ai_workstation_nextcloud_password: "{{ lookup('env', 'NEXTCLOUD_PASSWORD') | default('', true) }}"
# DragTokens OpenAI-compatible gateway for OpenCode (key bound to a codex-pro or enterprise pool group)
ai_workstation_dragtokens_api_key: "{{ lookup('env', 'DRAGTOKENS_API_KEY') | default('', true) }}"
ai_workstation_dragtokens_ech_proxy: true
ai_workstation_dragtokens_ech_proxy_host: "127.0.0.1"
ai_workstation_dragtokens_ech_proxy_port: 4097

# MCP server runtimes. Harness configs are owned by yadm:
#   ~/.config/ai/claude-plugins (Claude Code plugin), ~/.gemini/config/mcp_config.json##template,
#   ~/.config/opencode/opencode.json##template
ai_workstation_user_uid: "{{ target_user_uid | default(1000) }}"
ai_workstation_mcp_npm_packages:
  - "@playwright/mcp"
  - "@modelcontextprotocol/server-memory"
ai_workstation_mcp_npm_state: latest
ai_workstation_mcp_uv_tools:
  - { name: serena-agent, python: "3.13" }
  - { name: markitdown-mcp }
  - { name: nextcloud-mcp-server }
  - { name: mcp-server-docker }
  - { name: arxiv-mcp-server }
  - { name: zotero-mcp-server }
  - { name: mcp-server-fetch }
  - { name: mcp-server-git }
  - { name: package-version-check-mcp }
  # semgrep pins mcp==1.29.0 (CVE-2026-59951); the override takes the newest 1.x (1.30.0 has the fix,
  # 2.x renamed FastMCP and breaks it)
  - { name: semgrep, overrides: ["mcp<2"] }
  - { name: wikipedia-mcp }
  # openroute-mcp leaves mcp unpinned and breaks on mcp 2.x (FastMCP renamed)
  - { name: openroute-mcp, overrides: ["mcp<2"] }
  # Key-less web search; installed without the [browser] extra, so no curl TLS impersonation
  - { name: duckduckgo-mcp-server }
  - { name: oebb-mcp-server }
  # PyPI stops at 0.3.5; releases continue on GitHub, so the tool follows the latest GitHub release tag
  - name: mcp-youtube-transcript
    github_release: jkawamoto/mcp-youtube-transcript
ai_workstation_mcp_uv_overrides_dir: "{{ ai_workstation_user_home }}/.config/ai/uv-overrides"
# Node.js MCP servers, one npm prefix each under ai_workstation_mcp_node_dir, always on the latest
# release: every run updates the whole tree (`npm update`). `overrides` force vulnerable transitive
# dependencies to their latest release where the server's own ranges keep an affected one (npm audit
# gates the role), `allow_scripts` is the npm install-script allowlist by package name (unset: no
# install scripts run), `env` is exported by the wrapper.
ai_workstation_mcp_node_dir: /opt/mcp
ai_workstation_mcp_node_servers:
  - name: openalex
    package: "@cyanheads/openalex-mcp-server"
    bin: openalex-mcp-server
  - name: excalidraw
    package: mcp-excalidraw-server
    bin: mcp-excalidraw-server
    # The auto-started canvas server binds $HOST:$PORT; zsh exports HOST as the machine name
    env:
      HOST: 127.0.0.1
      PORT: "{{ ai_workstation_excalidraw_port }}"
      EXPRESS_SERVER_URL: "http://127.0.0.1:{{ ai_workstation_excalidraw_port }}"
    # Its latest release still ranges onto affected zod 3, mermaid 10, dompurify, katex, lodash-es,
    # nanoid, uuid and the chevrotain/langium parser chain; tool schemas and calls verified on zod 4
    overrides:
      "@modelcontextprotocol/core": latest
      "@modelcontextprotocol/server": latest
      chevrotain: latest
      dompurify: latest
      katex: latest
      langium: latest
      lodash-es: latest
      mermaid: latest
      nanoid: latest
      sass: latest
      uuid: latest
      zod: latest
  - name: drawio
    package: "@drawio/mcp"
    bin: drawio-mcp
  - name: obsidian-hybrid-search
    package: obsidian-hybrid-search
    bin: obsidian-hybrid-search
    # onnxruntime-node ships its CPU runtime; its postinstall only downloads ~270 MB of CUDA providers
    allow_scripts:
      better-sqlite3: true
      onnxruntime-node: false
      protobufjs: false
  - name: lighthouse
    package: "@danielsogl/lighthouse-mcp"
    bin: lighthouse-mcp-server
    env:
      CHROME_PATH: "{{ ai_workstation_mcp_chromium }}"
  - name: accessibility-scanner
    package: accessibility-scanner-mcp
    bin: accessibility-scanner-mcp
    env:
      CHROME_PATH: "{{ ai_workstation_mcp_chromium }}"
  - name: docs
    package: "@arabold/docs-mcp-server"
    bin: docs-mcp-server
    env:
      DOCS_MCP_TELEMETRY: "false"
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: "{{ ai_workstation_mcp_chromium }}"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    # Native modules compile with node-gyp (gcc-c++, make); the package's own postinstall only echoes
    allow_scripts:
      better-sqlite3: true
      tree-sitter: true
      tree-sitter-javascript: true
      tree-sitter-python: true
      tree-sitter-typescript: true
      "@arabold/docs-mcp-server": false
  - name: nasa
    package: "@programcomputer/nasa-mcp-server"
    bin: nasa-mcp-server
  - name: open-meteo
    package: open-meteo-mcp-server
    bin: open-meteo-mcp-server
  - name: ris-austria
    package: "@cyanheads/ris-austria-mcp-server"
    bin: ris-austria-mcp-server
  - name: eur-lex
    package: "@cyanheads/eur-lex-mcp-server"
    bin: eur-lex-mcp-server
ai_workstation_excalidraw_port: 3031
# Thunderbird MCP from its latest GitHub release: the Node bridge (no dependencies) from the release
# tag, the add-on (.xpi, verified against the release digest) next to it for a manual install in
# Thunderbird
ai_workstation_thunderbird_mcp: true
ai_workstation_thunderbird_mcp_repo: TKasperczyk/thunderbird-mcp
ai_workstation_thunderbird_mcp_dir: "{{ ai_workstation_mcp_node_dir }}/thunderbird-mcp"
ai_workstation_thunderbird_mcp_files: [mcp-bridge.cjs, package.json]
# Lighthouse, the accessibility scanner and Playwright hard-code --no-sandbox; this wrapper drops it
ai_workstation_mcp_chromium: /usr/local/libexec/mcp-chromium-sandboxed
# Grounded Docs: version-matched documentation index, one loopback HTTP server for all sessions
ai_workstation_docs_mcp: true
ai_workstation_docs_mcp_port: 6280
ai_workstation_docs_mcp_store: "{{ ai_workstation_user_home }}/.local/share/docs-mcp-server"
# GPX routes from the openroute MCP server (Documents is a Syncthing folder, so they reach the phone)
ai_workstation_openroute_routes_dir: "{{ ai_workstation_user_home }}/Documents/Routes"
# Free API keys (api.nasa.gov, openrouteservice.org); NASA falls back to the public DEMO_KEY
ai_workstation_nasa_api_key: "{{ lookup('env', 'NASA_API_KEY') | default('', true) }}"
ai_workstation_openroute_api_key: "{{ lookup('env', 'OPENROUTESERVICE_API_KEY') | default('', true) }}"
# Phở Research Tools (reference verification, retractions, PRISMA 2020) served on loopback only.
# Upstream ships no package or releases; the role follows the default branch, updates the dependency
# tree to the latest versions its ranges allow and audits it.
ai_workstation_pho: true
ai_workstation_pho_repo: https://github.com/thaohienhomes/pho-research-tools.git
ai_workstation_pho_version: HEAD
ai_workstation_pho_pnpm: "pnpm@latest"
# Its MCP SDK 1.x and its own code range onto affected zod 3 (GHSA-mrhx-c7xc-m3w5); tools verified on zod 4
ai_workstation_pho_overrides:
  zod: latest
ai_workstation_pho_dir: "{{ ai_workstation_user_home }}/.local/share/pho-research-tools"
ai_workstation_pho_port: 8787
# Obsidian Hybrid Search HTTP servers (one per vault, loopback; about 700 MB RSS each with the
# local embedding and reranker models). The index lives in the vault and is excluded from Syncthing.
ai_workstation_ohs_vaults:
  - name: phd
    path: "{{ ai_workstation_user_home }}/Obsidian/Ph.D."
    port: 3939
  - name: adrixan
    path: "{{ ai_workstation_user_home }}/Obsidian/Adrixan"
    port: 3940
    # schulpc (7.5 GB RAM, many concurrent agent sessions) ran out of memory with this index
    skip_hosts: [schulpc]
ai_workstation_ohs_syncthing_root: "{{ ai_workstation_user_home }}/Obsidian"
ai_workstation_mcp_tools_update_on_calendar: daily
ai_workstation_claude_bin: "{{ ai_workstation_user_home }}/.local/bin/claude"
ai_workstation_claude_marketplace_dir: "{{ ai_workstation_user_home }}/.config/ai/claude-plugins"
# Knowledge graph of the memory MCP server, inside the Syncthing "sync" folder
ai_workstation_mcp_memory_dir: "{{ ai_workstation_user_home }}/sync/ai"
# User-scope servers previously written to ~/.claude.json, now provided by the workstation-mcp plugin
ai_workstation_legacy_claude_mcp_servers: [github, puppeteer, sqlite, memory, fetch, git, arxiv, zotero]

# Read-only Docker API for the docker MCP server (deployed only where Docker is installed)
ai_workstation_docker_mcp_proxy: true
# Image tag = latest GitHub release of the proxy (docker-compose@ pulls it at every start)
ai_workstation_docker_mcp_proxy_image: tecnativa/docker-socket-proxy
ai_workstation_docker_mcp_proxy_repo: Tecnativa/docker-socket-proxy
ai_workstation_docker_mcp_proxy_port: 2375

# Keep user services (remote control, update timers) running without a login session
ai_workstation_linger: true

# Remote control configuration across harnesses
ai_workstation_claude_remote_control: true
ai_workstation_antigravity_remote_control: true
ai_workstation_opencode_remote_control: true
# Always-on `claude remote-control` servers, one per working directory (sessions started from the
# Claude app run in that directory). Needs the one-time "Enable Remote Control?" consent and workspace
# trust per directory, given interactively once; the role skips servers until both are present.
ai_workstation_claude_rc_servers:
  - name: phd
    label: "PhD"
    dir: "{{ ai_workstation_user_home }}/Obsidian/Ph.D."
  - name: teaching
    label: "Teaching"
    dir: "{{ ai_workstation_user_home }}/Obsidian/Adrixan/Teaching"
  - name: educator
    label: "Educator"
    dir: "{{ ai_workstation_user_home }}/Obsidian/Adrixan/Educator"
  # General deep-research jobs; reports land in this vault folder (rules in its AGENTS.md)
  - name: research
    label: "Deep Research"
    dir: "{{ ai_workstation_user_home }}/Obsidian/Adrixan/Research"
  # Coding across all projects; sessions cd into ~/code/<project> and follow its AGENTS.md
  - name: code
    label: "Code"
    dir: "{{ ai_workstation_user_home }}/code"
# No server for the home directory itself: Claude Code never saves home-directory trust, so a
# headless server there exits with "Workspace not trusted".
ai_workstation_claude_rc_permission_mode: auto
ai_workstation_opencode_server_port: 4096
ai_workstation_opencode_server_host: "127.0.0.1"
# Persisted with `opencode service set` (~/.config/opencode/service.json, which also holds the generated server password)
ai_workstation_opencode_service_settings:
  hostname: "{{ ai_workstation_opencode_server_host }}"
  port: "{{ ai_workstation_opencode_server_port }}"
# Native install from the ai_desktop role
ai_workstation_opencode_bin: "{{ ai_workstation_user_home }}/.opencode/bin/opencode"
