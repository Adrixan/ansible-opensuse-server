---
# topgrade_nightly: unattended nightly `topgrade` run (openSUSE Tumbleweed: zypper dup plus the
# allow-listed steps below), Healthchecks pings, optional reboot inside a night window.
# Only allow-listed steps run, so new topgrade steps never start unattended by surprise.
# Kept off on purpose: firmware (no unattended flashing), self_update (package-managed),
# ruby_gems (would `gem update` RPM-owned gems), git_repos and yadm (pulls need a human),
# pipx and pip (no supply-chain cooldown), AI CLIs with own self-updaters.
topgrade_nightly_steps: [system, flatpak, node, tldr]   # add containers where Docker runs
topgrade_nightly_timer: true            # false: no automatic runs, only `update-system` on demand
topgrade_nightly_time: "03:30"
topgrade_nightly_random_delay: 20min
topgrade_nightly_reboot: false          # true only where an unattended boot works
topgrade_nightly_reboot_from: 1         # reboot window, local hours [from, until)
topgrade_nightly_reboot_until: 6
topgrade_nightly_min_free_mb: 4096
topgrade_nightly_npm_prefix: ""       # root's global npm prefix, e.g. /usr/local; empty keeps npm's default
topgrade_nightly_hc_url: ""             # Healthchecks ping URL (from the controller env, never in git)
topgrade_nightly_wait_units: []         # "user:unit" user units that finish first (before the run and a reboot)
topgrade_nightly_wait_max_min: 90
topgrade_nightly_snapshot_dir: ""       # /etc tarball and package lists before the run, 7 kept (no fs snapshots on ext4)
topgrade_nightly_ansible_user: ""       # Ansible roles run as this user from its clone ...
topgrade_nightly_ansible_repo: ""       # ... only when the clone is clean on master ...
topgrade_nightly_ansible_roles: []      # ... with enable_<role>=true for each
topgrade_nightly_firmware_report: false # fwupd refresh plus report, never an install
topgrade_nightly_reboot_require_fs_uuid: ""  # reboot only while this filesystem (unlock stick) is present
topgrade_nightly_pre_reboot_check: ""   # command that must succeed before a reboot
topgrade_nightly_rc_user: ""            # rc roles of this user gate the reboot and get reboot notes
topgrade_nightly_rc_quiet_wait_min: 60
topgrade_nightly_post_boot_check: ""  # command after an unattended reboot; output goes into the report
