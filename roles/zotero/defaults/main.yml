---
# defaults file for zotero
zotero_user: "{{ target_user | default('Adrixan') }}"
zotero_user_home: "{{ target_user_home | default('/home/' + zotero_user) }}"
zotero_flatpak_name: "org.zotero.Zotero"
zotero_flatpak_remote: "flathub"
# The flatpak keeps its profiles in ~/.zotero/zotero (persistent path of the sandbox)
zotero_profile_root: "{{ zotero_user_home }}/.zotero/zotero"
# Profile created when Zotero has never run on this machine
zotero_new_profile_dir: "ansible.default"

# Better BibTeX from the upstream release; bump version and digest together
# (gh api repos/retorquere/zotero-better-bibtex/releases/latest -q '.assets[] | .name + " " + .digest').
zotero_bbt_version: "9.0.71"
zotero_bbt_sha256: "bf61a1690dc8a2b7ab09be9de2c89986f4fb6d495c82407d89b102b26fbaa9d5"

# Enforced at every Zotero start through user.js in the profile.
# autoDisableScopes 14 auto-enables add-ons placed in the profile itself (Zotero default 15 leaves the
# sideloaded Better BibTeX disabled until confirmed); writing the profile already grants full control.
zotero_prefs:
  extensions.autoDisableScopes: 14
  extensions.zotero.httpServer.localAPI.enabled: true
  extensions.zotero.translators.better-bibtex.asciiBibTeX: false
  extensions.zotero.translators.better-bibtex.citekeyFormat: "auth.lower + year + shorttitle(1, 0).lower"
  extensions.zotero.translators.better-bibtex.citekeyFormatEditing: "auth.lower + year + shorttitle(1, 0).lower"
