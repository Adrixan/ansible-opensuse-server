---
# tasks file for ssh_setup
- name: Create SSH key directory for user
  ansible.builtin.file:
    path: "{{ target_user_home }}/.ssh"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0700'

- name: Upload user authorized keys
  ansible.builtin.copy:
    src: authorized_keys
    dest: "{{ target_user_home }}/.ssh/authorized_keys"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0600'
