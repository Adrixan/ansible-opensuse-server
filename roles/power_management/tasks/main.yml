---
# tasks file for power_management
- name: Install power management packages
  community.general.zypper:
    name: "{{ power_packages }}"
    state: present

- name: Apply the XPS 13 9310 USB-C wake workaround
  ansible.builtin.include_tasks: xps13_9310_wake_gpes.yml
  when:
    - ansible_facts['system_vendor'] == "Dell Inc."
    - ansible_facts['product_name'] == "XPS 13 9310"

- name: Reload the XPS 13 9310 wireless modules around sleep
  ansible.builtin.include_tasks: xps13_9310_sleep_wireless.yml
  when:
    - ansible_facts['system_vendor'] == "Dell Inc."
    - ansible_facts['product_name'] == "XPS 13 9310"
