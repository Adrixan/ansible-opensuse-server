---
# tasks file for cli_tools
- name: Install build tool dependencies
  community.general.zypper:
    name: "{{ build_packages }}"
    state: present

- name: Install command-line tools from the distribution
  community.general.zypper:
    name: "{{ cli_packages }}"
    state: present

- name: Install global npm CLI tools
  community.general.npm:
    name: "{{ item }}"
    global: true
  loop: "{{ npm_global_packages }}"

- name: Uninstall retired global npm CLI tools
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: absent
  loop: "{{ npm_global_retired }}"

- name: Install pip CLI tools
  ansible.builtin.pip:
    name: "{{ item }}"
    extra_args: "--break-system-packages"
  loop: "{{ pip_cli_packages }}"

- name: Uninstall retired pip CLI tools
  ansible.builtin.pip:
    name: "{{ pip_cli_retired }}"
    state: absent
    extra_args: "--break-system-packages"
  when: pip_cli_retired | length > 0

# tintin++ was built from source here until Peter dropped it (cleanup round 3, 2026-11-18)
- name: Remove the retired tintin++ build
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/usr/local/bin/tt++, /tmp/tintin]
